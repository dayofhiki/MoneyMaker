name: MoneyMaker High Resolution Access Probe

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/high-resolution-probe-request.json'
  workflow_dispatch:
    inputs:
      ticker:
        description: Historical entitlement probe ticker
        required: true
        default: 'AAPL'
      day:
        description: Historical entitlement probe day (YYYY-MM-DD)
        required: true
        default: '2026-01-02'
      request_id:
        description: Artifact request identifier
        required: true
        default: 'manual'

permissions:
  contents: read
  actions: read

jobs:
  request:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.read.outputs.enabled }}
      ticker: ${{ steps.read.outputs.ticker }}
      day: ${{ steps.read.outputs.day }}
      request_id: ${{ steps.read.outputs.request_id }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TICKER: ${{ inputs.ticker }}
          INPUT_DAY: ${{ inputs.day }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              enabled = True
              ticker = os.environ["INPUT_TICKER"]
              day = os.environ["INPUT_DAY"]
              request_id = os.environ["INPUT_REQUEST_ID"]
          else:
              payload = json.loads(
                  Path("victory-trader/research/high-resolution-probe-request.json").read_text(
                      encoding="utf-8"
                  )
              )
              enabled = payload.get("operation") == "high_resolution_access_probe_v01"
              ticker = str(payload.get("ticker", ""))
              day = str(payload.get("day", ""))
              request_id = str(payload.get("request_id", ""))
          if enabled and (not ticker or not day or not request_id):
              raise SystemExit("high-resolution probe request is incomplete")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"enabled={'true' if enabled else 'false'}\n")
              handle.write(f"ticker={ticker}\n")
              handle.write(f"day={day}\n")
              handle.write(f"request_id={request_id}\n")
          PY

  probe:
    if: ${{ needs.request.outputs.enabled == 'true' }}
    needs: request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      MASSIVE_S3_ACCESS_KEY: ${{ secrets.MASSIVE_S3_ACCESS_KEY }}
      MASSIVE_S3_SECRET_KEY: ${{ secrets.MASSIVE_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'

      - name: Test high-resolution probe
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_massive_client.py tests/test_high_resolution_access_probe.py

      - name: Probe existing historical data access
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.high_resolution_access_probe \
            --ticker "${{ needs.request.outputs.ticker }}" \
            --day "${{ needs.request.outputs.day }}" \
            --output artifacts/high-resolution-access-v01.json \
            | tee artifacts/high-resolution-access-v01.log
          test -s artifacts/high-resolution-access-v01.json

      - name: Upload high-resolution access audit
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-high-resolution-access-v01-${{ needs.request.outputs.request_id }}
          path: |
            victory-trader/artifacts/high-resolution-access-v01.json
            victory-trader/artifacts/high-resolution-access-v01.log
          if-no-files-found: error
          retention-days: 90
