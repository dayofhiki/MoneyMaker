name: MoneyMaker BUY-Gated Position Observability

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/buy-gated-position-observability-request.json'

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Test request 166
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q \
            tests/test_buy_gated_position_observability.py \
            tests/test_causal_entry_executability.py

  prepare:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        phase: [fit, calibration, evaluation]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Restore second cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-request166-second-${{ matrix.phase }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-request165-second-${{ runner.os }}-
            moneymaker-fresh-economic-second-${{ runner.os }}-
            moneymaker-request163-opportunity-second-${{ runner.os }}-
      - name: Download Request 163 first-HOT result
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-extended-history-economic-opportunity-v10-163
          path: victory-trader/prepared/history
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Request 163 opportunity scan
        uses: actions/download-artifact@v4
        with:
          name: request163-opportunity-prepared
          path: victory-trader/prepared/opportunity
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare position phase
        run: |
          mkdir -p prepared/output
          python -m victory_trader.buy_gated_position_observability \
            prepare ${{ matrix.phase }} \
            --first-hot prepared/history/extended-history-economic-opportunity-v10.parquet \
            --scan prepared/opportunity/opportunity-scan.parquet \
            --output prepared/output/${{ matrix.phase }}-paths.parquet \
            --audit prepared/output/${{ matrix.phase }}-audit.json
      - name: Save second cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-request166-second-${{ matrix.phase }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: request166-position-${{ matrix.phase }}
          path: victory-trader/prepared/output/
          if-no-files-found: error
          retention-days: 14

  evaluate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Download position phases
        uses: actions/download-artifact@v4
        with:
          pattern: request166-position-*
          path: victory-trader/prepared/position
          merge-multiple: true
      - name: Evaluate request 166
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.buy_gated_position_observability \
            evaluate \
            --fit prepared/position/fit-paths.parquet \
            --calibration prepared/position/calibration-paths.parquet \
            --evaluation prepared/position/evaluation-paths.parquet \
            --fit-audit prepared/position/fit-audit.json \
            --calibration-audit prepared/position/calibration-audit.json \
            --evaluation-audit prepared/position/evaluation-audit.json \
            --output artifacts/buy-gated-position-observability-v10.json \
            --scored-output artifacts/buy-gated-position-observability-v10.parquet \
            | tee artifacts/buy-gated-position-observability-v10.log
      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-buy-gated-position-observability-v10-166
          path: |
            victory-trader/artifacts/buy-gated-position-observability-v10.json
            victory-trader/artifacts/buy-gated-position-observability-v10.parquet
            victory-trader/artifacts/buy-gated-position-observability-v10.log
          if-no-files-found: error
          retention-days: 90
