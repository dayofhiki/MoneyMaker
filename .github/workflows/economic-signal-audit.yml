name: MoneyMaker Economic Signal Audit

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/economic-signal-audit-request.json'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Test request 164
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_economic_signal_audit.py
      - name: Download request 163 result artifact
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-extended-history-economic-opportunity-v10-163
          path: victory-trader/prepared/result
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download request 163 opportunity artifact
        uses: actions/download-artifact@v4
        with:
          name: request163-opportunity-prepared
          path: victory-trader/prepared/opportunity
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run request 164
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.economic_signal_audit_vectorized \
            --first-hot prepared/result/extended-history-economic-opportunity-v10.parquet \
            --opportunity-scan prepared/opportunity/opportunity-scan.parquet \
            --output-json artifacts/economic-signal-audit-v10.json \
            --signal-csv artifacts/economic-signal-audit-signals.csv \
            --horizon-csv artifacts/economic-signal-audit-horizons.csv \
            | tee artifacts/economic-signal-audit-v10.log
      - name: Upload request 164 artifact
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-economic-signal-audit-v10-164
          path: |
            victory-trader/artifacts/economic-signal-audit-v10.json
            victory-trader/artifacts/economic-signal-audit-signals.csv
            victory-trader/artifacts/economic-signal-audit-horizons.csv
            victory-trader/artifacts/economic-signal-audit-v10.log
          if-no-files-found: error
          retention-days: 90
