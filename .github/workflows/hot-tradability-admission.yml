name: MoneyMaker HOT Tradability Admission

on:
  push:
    branches:
      - research/hot-tradability-admission-229
    paths:
      - 'victory-trader/research/hot-tradability-admission-request.json'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: victory-trader
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical stack
        run: python -m pip install -e '.[dev]' -c research/request214-requirements.txt
      - name: Check code and HOT-tradability contract
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_hot_tradability_admission.py tests/test_watch_option_admission.py tests/test_multi_event_entry_continuation.py
      - name: Download Request 171 rich-second fit/calibration
        uses: actions/download-artifact@v4
        with:
          pattern: request171-rich-second-*
          path: victory-trader/prepared/rich
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36033120106
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Request 163 opportunity scan
        uses: actions/download-artifact@v4
        with:
          name: request163-opportunity-prepared
          path: victory-trader/prepared/opportunity
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Request 178 development shards
        uses: actions/download-artifact@v4
        with:
          pattern: request178-fresh-*
          path: victory-trader/prepared/fresh
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36038233507
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate request 229
        run: |
          set -o pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          python -m victory_trader.hot_tradability_admission \
            --fit-positions prepared/rich/fit-rich-second.parquet \
            --calibration-positions prepared/rich/calibration-rich-second.parquet \
            --history-scan prepared/opportunity/opportunity-scan.parquet \
            --fresh-dir prepared/fresh \
            --output artifacts/request229.json \
            --rows-output artifacts/request229-hot-policy.parquet \
            | tee artifacts/request229.log
      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-hot-tradability-admission-229
          path: |
            victory-trader/artifacts/request229.json
            victory-trader/artifacts/request229-hot-policy.parquet
            victory-trader/artifacts/request229.log
            victory-trader/artifacts/source-sha.txt
          if-no-files-found: error
          retention-days: 90
