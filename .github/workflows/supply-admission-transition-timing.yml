name: MoneyMaker Supply Admission Transition Timing

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/supply-admission-transition-timing-request.json'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Test request 213
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_supply_admission_transition_timing.py
      - name: Restore Massive REST cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-rest
          key: moneymaker-request213-supply-${{ github.run_id }}
          restore-keys: |
            moneymaker-request74-
            moneymaker-request73-
      - name: Download Request 171 rich-second phases
        uses: actions/download-artifact@v4
        with:
          pattern: request171-rich-second-*
          path: victory-trader/prepared/rich
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36033120106
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Request 178 fresh shards
        uses: actions/download-artifact@v4
        with:
          pattern: request178-fresh-*
          path: victory-trader/prepared/fresh
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36038233507
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate request 213
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.supply_admission_transition_timing \
            --fit-positions prepared/rich/fit-rich-second.parquet \
            --calibration-positions prepared/rich/calibration-rich-second.parquet \
            --fresh-dir prepared/fresh \
            --output artifacts/supply-admission-transition-timing-v13.json \
            --rows-output artifacts/supply-admission-transition-timing-v13.parquet \
            --cache-dir data/cache/massive-rest \
            | tee artifacts/supply-admission-transition-timing-v13.log
      - name: Save Massive REST cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive-rest
          key: moneymaker-request213-supply-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-supply-admission-transition-timing-v13-213
          path: |
            victory-trader/artifacts/supply-admission-transition-timing-v13.json
            victory-trader/artifacts/supply-admission-transition-timing-v13.parquet
            victory-trader/artifacts/supply-admission-transition-timing-v13.log
          if-no-files-found: error
          retention-days: 90
