name: MoneyMaker Minute Conflict Probe

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/minute-conflict-probe-request.json'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      MASSIVE_S3_ACCESS_KEY: ${{ secrets.MASSIVE_S3_ACCESS_KEY }}
      MASSIVE_S3_SECRET_KEY: ${{ secrets.MASSIVE_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Restore Flat File cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-minute-conflict-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-market-relative-flatfiles-${{ runner.os }}-
            moneymaker-attention-v01-${{ runner.os }}-
      - name: Run read-only minute conflict diagnostic
        run: |
          set -o pipefail
          mkdir -p artifacts
          python - <<'PY' > /tmp/request.env
          import json
          from pathlib import Path
          payload = json.loads(Path("research/minute-conflict-probe-request.json").read_text())
          print("TICKER=" + payload["ticker"])
          print("DAY=" + payload["day"])
          print("REQUEST_ID=" + str(payload["request_id"]))
          PY
          source /tmp/request.env
          python -m victory_trader.minute_conflict_probe \
            --ticker "$TICKER" \
            --day "$DAY" \
            --output artifacts/minute-conflict-probe.json \
            | tee artifacts/minute-conflict-probe.log
          test -s artifacts/minute-conflict-probe.json
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-minute-conflict-probe
          path: |
            victory-trader/artifacts/minute-conflict-probe.json
            victory-trader/artifacts/minute-conflict-probe.log
          if-no-files-found: error
          retention-days: 30
