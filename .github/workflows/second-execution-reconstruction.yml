name: MoneyMaker Second Execution Reconstruction

on:
  push:
    branches:
      - research/second-execution-reconstruction-244
    paths:
      - 'victory-trader/research/second-execution-reconstruction-request.json'
      - 'victory-trader/src/victory_trader/second_execution_reconstruction.py'
      - 'victory-trader/tests/test_second_execution_reconstruction.py'
      - '.github/workflows/second-execution-reconstruction.yml'
  pull_request:
    paths:
      - 'victory-trader/research/second-execution-reconstruction-request.json'
      - 'victory-trader/src/victory_trader/second_execution_reconstruction.py'
      - 'victory-trader/tests/test_second_execution_reconstruction.py'
      - '.github/workflows/second-execution-reconstruction.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: victory-trader
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical stack
        run: python -m pip install -e '.[dev]' -c research/request214-requirements.txt
      - name: Check Request244 contracts
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_second_execution_reconstruction.py tests/test_chronological_action_value.py
      - name: Download Request171 rich-second fit/calibration
        uses: actions/download-artifact@v4
        with:
          pattern: request171-rich-second-*
          path: victory-trader/prepared/rich
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36033120106
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate Request244
        run: |
          set -o pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          python -m victory_trader.second_execution_reconstruction \
            --fit-positions prepared/rich/fit-rich-second.parquet \
            --calibration-positions prepared/rich/calibration-rich-second.parquet \
            --output artifacts/request244.json \
            --rows-output artifacts/request244-rows.parquet \
            | tee artifacts/request244.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneymaker-second-execution-reconstruction-244
          path: |
            victory-trader/artifacts/request244.json
            victory-trader/artifacts/request244-rows.parquet
            victory-trader/artifacts/request244.log
            victory-trader/artifacts/source-sha.txt
          if-no-files-found: warn
          retention-days: 90
