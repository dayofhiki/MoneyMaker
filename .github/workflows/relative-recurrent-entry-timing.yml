name: MoneyMaker Relative Recurrent Entry Timing

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/relative-recurrent-entry-timing-request.json'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Test request 207
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_relative_recurrent_entry_timing.py
      - name: Download Request 171 rich-second phases
        uses: actions/download-artifact@v4
        with:
          pattern: request171-rich-second-*
          path: victory-trader/prepared/rich
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36033120106
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Request 178 fresh shards
        uses: actions/download-artifact@v4
        with:
          pattern: request178-fresh-*
          path: victory-trader/prepared/fresh
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36038233507
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate request 207
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.relative_recurrent_entry_timing \
            --fit-positions prepared/rich/fit-rich-second.parquet \
            --calibration-positions prepared/rich/calibration-rich-second.parquet \
            --fresh-dir prepared/fresh \
            --output artifacts/relative-recurrent-entry-timing-v10.json \
            --rows-output artifacts/relative-recurrent-entry-timing-v10.parquet \
            | tee artifacts/relative-recurrent-entry-timing-v10.log
      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-relative-recurrent-entry-timing-v10-207
          path: |
            victory-trader/artifacts/relative-recurrent-entry-timing-v10.json
            victory-trader/artifacts/relative-recurrent-entry-timing-v10.parquet
            victory-trader/artifacts/relative-recurrent-entry-timing-v10.log
          if-no-files-found: error
          retention-days: 90
