name: MoneyMaker Entry Survivability Gate

on:
  push:
    branches:
      - research/entry-survivability-226
    paths:
      - 'victory-trader/research/entry-survivability-gate-request.json'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: victory-trader
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical stack
        run: python -m pip install -e '.[dev]' -c research/request214-requirements.txt
      - name: Check code and entry-survivability contract
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_entry_survivability_gate.py tests/test_pullback_turn_transition_entry.py tests/test_event_time_position_replay.py
      - name: Download Request 171 rich-second fit/calibration
        uses: actions/download-artifact@v4
        with:
          pattern: request171-rich-second-*
          path: victory-trader/prepared/rich
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36033120106
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Request 178 development shards
        uses: actions/download-artifact@v4
        with:
          pattern: request178-fresh-*
          path: victory-trader/prepared/fresh
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36038233507
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate request 226
        run: |
          set -o pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          python -m victory_trader.entry_survivability_gate \
            --fit-positions prepared/rich/fit-rich-second.parquet \
            --calibration-positions prepared/rich/calibration-rich-second.parquet \
            --fresh-dir prepared/fresh \
            --output artifacts/request226.json \
            --rows-output artifacts/request226-entry-gate.parquet \
            | tee artifacts/request226.log
      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-entry-survivability-gate-226
          path: |
            victory-trader/artifacts/request226.json
            victory-trader/artifacts/request226-entry-gate.parquet
            victory-trader/artifacts/request226.log
            victory-trader/artifacts/source-sha.txt
          if-no-files-found: error
          retention-days: 90
