name: MoneyMaker Calibrated Execution Admission

on:
  push:
    branches:
      - research/calibrated-execution-admission-261
    paths:
      - 'victory-trader/research/calibrated-execution-admission-request.json'
      - 'victory-trader/src/victory_trader/calibrated_execution_admission.py'
      - 'victory-trader/tests/test_calibrated_execution_admission.py'
      - '.github/workflows/calibrated-execution-admission.yml'
  pull_request:
    paths:
      - 'victory-trader/research/calibrated-execution-admission-request.json'
      - 'victory-trader/src/victory_trader/calibrated_execution_admission.py'
      - 'victory-trader/tests/test_calibrated_execution_admission.py'
      - '.github/workflows/calibrated-execution-admission.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: victory-trader
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical stack
        run: python -m pip install -e '.[dev]' -c research/request214-requirements.txt
      - name: Check Request261 contracts
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_calibrated_execution_admission.py tests/test_execution_aware_minute_controller.py
      - name: Download frozen Request233 full-HOT population
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-economic-full-hot-admission-233
          path: victory-trader/prepared/request233
          repository: dayofhiki/MoneyMaker
          run-id: 36251239308
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Request163 opportunity population
        uses: actions/download-artifact@v4
        with:
          name: request163-opportunity-prepared
          path: victory-trader/prepared/opportunity
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate Request261
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          python -m victory_trader.calibrated_execution_admission \
            --first-hot prepared/request233/request233-full-hot-states.parquet \
            --opportunity-scan prepared/opportunity/opportunity-scan.parquet \
            --output artifacts/request261.json \
            --rows-output artifacts/request261-rows.parquet \
            | tee artifacts/request261.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneymaker-calibrated-execution-admission-261
          path: |
            victory-trader/artifacts/request261.json
            victory-trader/artifacts/request261.log
            victory-trader/artifacts/request261-rows.parquet
            victory-trader/artifacts/source-sha.txt
          if-no-files-found: warn
          retention-days: 90
