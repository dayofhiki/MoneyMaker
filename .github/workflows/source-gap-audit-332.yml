name: MoneyMaker R332 Independent Cached Source Audit

on: [push]

permissions:
  contents: read
  actions: read

jobs:
  audit:
    if: github.ref == 'refs/heads/research/source-gap-audit-332'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: victory-trader
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' numpy==2.4.6 pandas==3.0.6 scipy==1.17.1 scikit-learn==1.9.1 pyarrow==25.0.1 pytest==9.1.1 ruff==0.16.10
      - name: Source census and unchanged action contract tests
        run: |
          ruff check src tests research/verify_request332.py --select E4,E7,E9,F
          pytest -q tests/test_cached_source_gap_audit.py tests/test_action_target_support_census.py tests/test_current_state_action_policy.py
      - uses: actions/download-artifact@v4
        with:
          name: moneymaker-research-request-311
          path: victory-trader/prepared/official311
          run-id: 37223064559
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: moneymaker-research-request-315
          path: victory-trader/prepared/official315
          run-id: 37450538746
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: moneymaker-independent-request-319
          path: victory-trader/prepared/official319
          run-id: 37588633963
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: moneymaker-independent-request-331
          path: victory-trader/prepared/official331
          run-id: 37752214023
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: One fixed audit without market requests or new labels
        run: |
          set -o pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          python --version > artifacts/environment.txt
          python -m pip freeze >> artifacts/environment.txt
          python -m victory_trader.cached_source_gap_audit \
            --previous prepared --pinned-inputs research/request332-inputs.json \
            --source-evidence research/request332-source-evidence.json \
            --output-dir artifacts 2>&1 | tee artifacts/request332-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneymaker-independent-request-332
          path: victory-trader/artifacts/
          if-no-files-found: warn
          retention-days: 90
