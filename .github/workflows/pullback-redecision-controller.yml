name: MoneyMaker Pullback Redecision Controller

on:
  push:
    branches:
      - research/pullback-redecision-controller-222
    paths:
      - 'victory-trader/research/pullback-redecision-controller-request.json'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: victory-trader
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical stack
        run: python -m pip install -e '.[dev]' -c research/request214-requirements.txt
      - name: Check code and pullback action contract
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_pullback_redecision_controller.py tests/test_transition_conditioned_option_value.py tests/test_entry_conditioned_rich_second.py
      - name: Download Request 171 rich-second fit/calibration
        uses: actions/download-artifact@v4
        with:
          pattern: request171-rich-second-*
          path: victory-trader/prepared/rich
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36033120106
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Request 163 opportunity scan
        uses: actions/download-artifact@v4
        with:
          name: request163-opportunity-prepared
          path: victory-trader/prepared/opportunity
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Request 221 fresh states
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-transition-conditioned-value-221
          path: victory-trader/prepared/request221
          repository: dayofhiki/MoneyMaker
          run-id: 36237423860
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate request 222
        run: |
          set -o pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          python -m victory_trader.pullback_redecision_controller \
            --fit-positions prepared/rich/fit-rich-second.parquet \
            --calibration-positions prepared/rich/calibration-rich-second.parquet \
            --history-scan prepared/opportunity/opportunity-scan.parquet \
            --fresh-states prepared/request221/request221-states.parquet \
            --output artifacts/request222.json \
            --rows-output artifacts/request222-pullbacks.parquet \
            | tee artifacts/request222.log
      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-pullback-redecision-controller-222
          path: |
            victory-trader/artifacts/request222.json
            victory-trader/artifacts/request222-pullbacks.parquet
            victory-trader/artifacts/request222.log
            victory-trader/artifacts/source-sha.txt
          if-no-files-found: error
          retention-days: 90
