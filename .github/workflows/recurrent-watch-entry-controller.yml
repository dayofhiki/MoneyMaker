name: MoneyMaker Recurrent Watch Entry Controller

on:
  push:
    branches:
      - research/causal-second-execution-20260925
    paths:
      - 'victory-trader/research/recurrent-watch-entry-controller-request.json'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'

      - name: Test request 204
        run: |
          ruff check \
            src/victory_trader/recurrent_watch_entry_controller.py \
            tests/test_recurrent_watch_entry_controller.py \
            --select E4,E7,E9,F
          pytest -q tests/test_recurrent_watch_entry_controller.py

      - name: Restore causal second cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: request204-second-${{ github.run_id }}
          restore-keys: |
            request197-second-
            moneymaker-request171-second-fit-
            moneymaker-request171-second-calibration-

      - name: Download Request 171 FIT/CAL POSITION states
        uses: actions/download-artifact@v4
        with:
          pattern: request171-rich-second-*
          path: victory-trader/prepared/rich
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36033120106
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download historical market scan
        uses: actions/download-artifact@v4
        with:
          name: request163-opportunity-prepared
          path: victory-trader/prepared/opportunity
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate request 204
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.recurrent_watch_entry_controller \
            --fit prepared/rich/fit-rich-second.parquet \
            --calibration prepared/rich/calibration-rich-second.parquet \
            --history-scan prepared/opportunity/opportunity-scan.parquet \
            --output artifacts/recurrent-watch-entry-controller-v10.json \
            | tee artifacts/recurrent-watch-entry-controller-v10.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneymaker-recurrent-watch-entry-controller-v10-204
          path: |
            victory-trader/artifacts/recurrent-watch-entry-controller-v10.json
            victory-trader/artifacts/recurrent-watch-entry-controller-v10.log
          if-no-files-found: warn
          retention-days: 90
