name: MoneyMaker Market Regime Positive Value

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/market-regime-positive-value-request.json'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Test request 174
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_market_regime_positive_value.py
      - name: Download Request 171 rich-second phases
        uses: actions/download-artifact@v4
        with:
          pattern: request171-rich-second-*
          path: victory-trader/prepared/rich
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36033120106
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Request 163 market-wide scan
        uses: actions/download-artifact@v4
        with:
          name: request163-opportunity-prepared
          path: victory-trader/prepared/opportunity
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate request 174
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.market_regime_positive_value \
            --fit prepared/rich/fit-rich-second.parquet \
            --calibration prepared/rich/calibration-rich-second.parquet \
            --evaluation prepared/rich/evaluation-rich-second.parquet \
            --scan prepared/opportunity/opportunity-scan.parquet \
            --output artifacts/market-regime-positive-value-v10.json \
            --scored-output artifacts/market-regime-positive-value-v10.parquet \
            | tee artifacts/market-regime-positive-value-v10.log
      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-market-regime-positive-value-v10-174
          path: |
            victory-trader/artifacts/market-regime-positive-value-v10.json
            victory-trader/artifacts/market-regime-positive-value-v10.parquet
            victory-trader/artifacts/market-regime-positive-value-v10.log
          if-no-files-found: error
          retention-days: 90
