name: MoneyMaker WATCH Option Admission

on:
  push:
    branches:
      - research/watch-option-admission-228
    paths:
      - 'victory-trader/research/watch-option-admission-request.json'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: victory-trader
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical stack
        run: python -m pip install -e '.[dev]' -c research/request214-requirements.txt
      - name: Check code and WATCH-admission contract
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_watch_option_admission.py tests/test_multi_event_entry_continuation.py tests/test_pullback_turn_transition_entry.py
      - name: Download Request 171 rich-second fit/calibration
        uses: actions/download-artifact@v4
        with:
          pattern: request171-rich-second-*
          path: victory-trader/prepared/rich
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36033120106
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Request 178 development shards
        uses: actions/download-artifact@v4
        with:
          pattern: request178-fresh-*
          path: victory-trader/prepared/fresh
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36038233507
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate request 228
        run: |
          set -o pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          python -m victory_trader.watch_option_admission \
            --fit-positions prepared/rich/fit-rich-second.parquet \
            --calibration-positions prepared/rich/calibration-rich-second.parquet \
            --fresh-dir prepared/fresh \
            --output artifacts/request228.json \
            --rows-output artifacts/request228-watch-policy.parquet \
            | tee artifacts/request228.log
      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-watch-option-admission-228
          path: |
            victory-trader/artifacts/request228.json
            victory-trader/artifacts/request228-watch-policy.parquet
            victory-trader/artifacts/request228.log
            victory-trader/artifacts/source-sha.txt
          if-no-files-found: error
          retention-days: 90
