name: MoneyMaker Causal Rich State Diagnostic

on:
  push:
    branches:
      - research/causal-rich-state-diagnostic-264
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: victory-trader
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]' -c research/request214-requirements.txt
      - name: Check
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_causal_rich_state_diagnostic.py
      - name: Download first-HOT
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-economic-full-hot-admission-233
          path: victory-trader/prepared/request233
          repository: dayofhiki/MoneyMaker
          run-id: 36251239308
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download opportunity
        uses: actions/download-artifact@v4
        with:
          name: request163-opportunity-prepared
          path: victory-trader/prepared/opportunity
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          mkdir -p artifacts
          python -m victory_trader.causal_rich_state_diagnostic             --first-hot prepared/request233/request233-full-hot-states.parquet             --opportunity-scan prepared/opportunity/opportunity-scan.parquet             --output artifacts/request264.json | tee artifacts/request264.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneymaker-causal-rich-state-diagnostic-264
          path: victory-trader/artifacts/
