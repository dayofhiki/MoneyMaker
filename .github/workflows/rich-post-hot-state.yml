name: MoneyMaker Rich Post HOT State

on:
  push:
    branches:
      - research/rich-post-hot-state-257
    paths:
      - 'victory-trader/research/rich-post-hot-state-request.json'
      - 'victory-trader/src/victory_trader/rich_post_hot_state.py'
      - 'victory-trader/tests/test_rich_post_hot_state.py'
      - '.github/workflows/rich-post-hot-state.yml'
  pull_request:
    paths:
      - 'victory-trader/research/rich-post-hot-state-request.json'
      - 'victory-trader/src/victory_trader/rich_post_hot_state.py'
      - 'victory-trader/tests/test_rich_post_hot_state.py'
      - '.github/workflows/rich-post-hot-state.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: victory-trader
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical stack
        run: python -m pip install -e '.[dev]' -c research/request214-requirements.txt
      - name: Check Request257 contracts
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_rich_post_hot_state.py tests/test_multistep_wait_option.py tests/test_learned_pullback_entry.py
      - name: Download frozen Request233 full-HOT population
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-economic-full-hot-admission-233
          path: victory-trader/prepared/request233
          repository: dayofhiki/MoneyMaker
          run-id: 36251239308
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Request163 opportunity population
        uses: actions/download-artifact@v4
        with:
          name: request163-opportunity-prepared
          path: victory-trader/prepared/opportunity
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate Request257
        run: |
          set -o pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          python -m victory_trader.rich_post_hot_state \
            --first-hot prepared/request233/request233-full-hot-states.parquet \
            --opportunity-scan prepared/opportunity/opportunity-scan.parquet \
            --output artifacts/request257.json \
            | tee artifacts/request257.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneymaker-rich-post-hot-state-257
          path: |
            victory-trader/artifacts/request257.json
            victory-trader/artifacts/request257.log
            victory-trader/artifacts/source-sha.txt
          if-no-files-found: warn
          retention-days: 90
