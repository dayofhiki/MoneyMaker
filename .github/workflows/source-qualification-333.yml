name: MoneyMaker R333 Bounded Historical Source Qualification

on: [push]

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    if: github.ref == 'refs/heads/research/source-qualification-333'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: victory-trader
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' numpy==2.4.6 pandas==3.0.6 scipy==1.17.1 scikit-learn==1.9.1 pyarrow==25.0.1 pytest==9.1.1 ruff==0.16.10
      - name: Synthetic transport and immutable existing contract regressions
        run: |
          ruff check src tests research/verify_request333.py --select E4,E7,E9,F
          pytest -q tests/test_historical_source_qualification.py tests/test_cached_source_gap_audit.py tests/test_action_target_support_census.py tests/test_current_state_action_policy.py
      - uses: actions/download-artifact@v4
        with:
          name: moneymaker-independent-request-332
          path: victory-trader/prepared/official332
          run-id: 37755971071
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Authenticate ALL original identity windows and fixed qualification sample
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          python --version > artifacts/environment.txt
          python -m pip freeze >> artifacts/environment.txt
          python -m victory_trader.historical_source_qualification --stage plan \
            --previous prepared --pinned-inputs research/request333-inputs.json \
            --plan research/request333-plan.json --output-dir artifacts
      - name: One bounded existing-account qualification acquisition
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          set -o pipefail
          python -m victory_trader.historical_source_qualification --stage collect \
            --plan research/request333-plan.json --output-dir artifacts/sources \
            2>&1 | tee artifacts/request333-collection.log
      - name: Publish immutable source pages before offline interpretation
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneymaker-source-qualification-333-pages
          path: |
            victory-trader/artifacts/source-sha.txt
            victory-trader/artifacts/environment.txt
            victory-trader/artifacts/request333-full-window-manifest.parquet
            victory-trader/artifacts/sources/
          if-no-files-found: error
          retention-days: 90
      - name: Offline-only source qualification analysis
        run: |
          set -o pipefail
          python -m victory_trader.historical_source_qualification --stage analyze \
            --plan research/request333-plan.json --source-dir artifacts/sources \
            --output-dir artifacts 2>&1 | tee artifacts/request333-analysis.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneymaker-source-qualification-333
          path: victory-trader/artifacts/
          if-no-files-found: warn
          retention-days: 90
