name: MoneyMaker Causal Entry Executability

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/causal-entry-executability-request.json'

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Test request 165
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q \
            tests/test_causal_entry_executability.py \
            tests/test_extended_history_economic_opportunity.py \
            tests/test_fresh_validated_attention_economic_opportunity.py

  prepare-fresh:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      MASSIVE_S3_ACCESS_KEY: ${{ secrets.MASSIVE_S3_ACCESS_KEY }}
      MASSIVE_S3_SECRET_KEY: ${{ secrets.MASSIVE_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Restore Flat File cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-request165-flatfiles-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-request163-opportunity-flatfiles-${{ runner.os }}-
            moneymaker-fresh-economic-flatfiles-${{ runner.os }}-
            moneymaker-fresh-hierarchical-flatfiles-${{ runner.os }}-
      - name: Restore REST cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive
          key: moneymaker-request165-rest-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-fresh-economic-rest-${{ runner.os }}-
            moneymaker-market-wide-rest-${{ runner.os }}-
      - name: Restore second cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-request165-second-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-request163-opportunity-second-${{ runner.os }}-
            moneymaker-fresh-economic-second-${{ runner.os }}-
      - name: Prepare fresh request 165
        run: |
          mkdir -p prepared
          python -m victory_trader.causal_entry_executability \
            prepare 2026-01-02 2026-06-22 \
            --candidates-output prepared/fresh-candidates.parquet \
            --scan-output prepared/fresh-scan.parquet \
            --audit-output prepared/fresh-audit.json
      - name: Save Flat File cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-request165-flatfiles-${{ runner.os }}-${{ github.run_id }}
      - name: Save REST cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive
          key: moneymaker-request165-rest-${{ runner.os }}-${{ github.run_id }}
      - name: Save second cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-request165-second-${{ runner.os }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: request165-fresh-prepared
          path: |
            victory-trader/prepared/fresh-candidates.parquet
            victory-trader/prepared/fresh-scan.parquet
            victory-trader/prepared/fresh-audit.json
          if-no-files-found: error
          retention-days: 14

  evaluate:
    needs: prepare-fresh
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: request165-fresh-prepared
          path: victory-trader/prepared/fresh
      - name: Download request 163 stage2
        uses: actions/download-artifact@v4
        with:
          name: request163-stage2-prepared
          path: victory-trader/prepared/stage2
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download request 163 result
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-extended-history-economic-opportunity-v10-163
          path: victory-trader/prepared/history
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate request 165
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.causal_entry_executability \
            evaluate \
            --history-first-hot prepared/history/extended-history-economic-opportunity-v10.parquet \
            --stage2-candidates prepared/stage2/stage2-candidates.parquet \
            --fresh-candidates prepared/fresh/fresh-candidates.parquet \
            --fresh-scan prepared/fresh/fresh-scan.parquet \
            --fresh-prepare-audit prepared/fresh/fresh-audit.json \
            --output artifacts/causal-entry-executability-v10.json \
            | tee artifacts/causal-entry-executability-v10.log
      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-causal-entry-executability-v10-165
          path: |
            victory-trader/artifacts/causal-entry-executability-v10.json
            victory-trader/artifacts/causal-entry-executability-v10.log
          if-no-files-found: error
          retention-days: 90
