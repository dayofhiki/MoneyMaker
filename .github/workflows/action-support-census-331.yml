name: MoneyMaker R331 Independent Cached Census

on: [push]

permissions:
  contents: read
  actions: read

jobs:
  census:
    if: github.ref == 'refs/heads/research/action-support-census-331'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: victory-trader
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' numpy==2.4.6 pandas==3.0.6 scipy==1.17.1 scikit-learn==1.9.1 pyarrow==25.0.1 pytest==9.1.1 ruff==0.16.10
      - name: Census and immutable action contract regressions
        run: |
          ruff check src tests research/verify_request331.py --select E4,E7,E9,F
          pytest -q tests/test_action_target_support_census.py tests/test_current_state_action_policy.py
      - uses: actions/download-artifact@v4
        with:
          name: moneymaker-research-request-311
          path: victory-trader/prepared/official311
          run-id: 37223064559
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: moneymaker-research-request-315
          path: victory-trader/prepared/official315
          run-id: 37450538746
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: moneymaker-independent-request-319
          path: victory-trader/prepared/official319
          run-id: 37588633963
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: moneymaker-independent-request-330
          path: victory-trader/prepared/official330
          run-id: 37748181012
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Freeze timestamp-only clock manifests before prices or labels
        run: |
          set -o pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          python --version > artifacts/environment.txt
          python -m pip freeze >> artifacts/environment.txt
          python -m victory_trader.action_target_support_census --stage clocks \
            --previous prepared --pinned-inputs research/request331-inputs.json \
            --output-dir artifacts 2>&1 | tee artifacts/request331-clocks.log
      - name: Publish clocks and all source identities before constructing targets
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-independent-request-331-clocks
          path: |
            victory-trader/artifacts/source-sha.txt
            victory-trader/artifacts/environment.txt
            victory-trader/artifacts/request331-clock-registration.json
            victory-trader/artifacts/request331-*-clocks.parquet
            victory-trader/artifacts/request331-*-clock-ledger.parquet
          if-no-files-found: error
          retention-days: 90
      - name: One fixed economic target and support census
        run: |
          set -o pipefail
          python -m victory_trader.action_target_support_census --stage outcomes \
            --previous prepared --pinned-inputs research/request331-inputs.json \
            --output-dir artifacts --clock-registration artifacts/request331-clock-registration.json \
            2>&1 | tee artifacts/request331-outcomes.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneymaker-independent-request-331
          path: victory-trader/artifacts/
          if-no-files-found: warn
          retention-days: 90
