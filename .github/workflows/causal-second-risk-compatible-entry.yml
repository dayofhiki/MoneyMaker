name: MoneyMaker Causal Second Risk Compatible Entry

on:
  push:
    branches:
      - research/causal-second-execution-20260925
    paths:
      - 'victory-trader/research/causal-second-risk-compatible-entry-request.json'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'

      - name: Test request 197
        run: |
          ruff check src/victory_trader/causal_second_execution.py             src/victory_trader/causal_second_risk_compatible_entry.py             tests/test_causal_second_execution.py             tests/test_causal_second_risk_compatible_entry.py             --select E4,E7,E9,F
          pytest -q             tests/test_causal_second_execution.py             tests/test_causal_second_risk_compatible_entry.py

      - name: Restore Request 171 FIT second cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: request197-fit-${{ github.run_id }}
          restore-keys: |
            moneymaker-request171-second-fit-

      - name: Restore Request 171 CAL second cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: request197-cal-${{ github.run_id }}
          restore-keys: |
            moneymaker-request171-second-calibration-

      - name: Download Request 171 FIT/CAL POSITION states
        uses: actions/download-artifact@v4
        with:
          pattern: request171-rich-second-*
          path: victory-trader/prepared/rich
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36033120106
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Request 178 fresh states and scan
        uses: actions/download-artifact@v4
        with:
          pattern: request178-fresh-*
          path: victory-trader/prepared/fresh
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36038233507
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download historical market scan
        uses: actions/download-artifact@v4
        with:
          name: request163-opportunity-prepared
          path: victory-trader/prepared/opportunity
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate request 197
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.causal_second_risk_compatible_entry             --fit prepared/rich/fit-rich-second.parquet             --calibration prepared/rich/calibration-rich-second.parquet             --history-scan prepared/opportunity/opportunity-scan.parquet             --fresh-dir prepared/fresh             --output artifacts/causal-second-risk-compatible-entry-v10.json             | tee artifacts/causal-second-risk-compatible-entry-v10.log

      - name: Save Request 197 second cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: request197-second-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneymaker-causal-second-risk-compatible-entry-v10-197
          path: |
            victory-trader/artifacts/causal-second-risk-compatible-entry-v10.json
            victory-trader/artifacts/causal-second-risk-compatible-entry-v10.log
          if-no-files-found: warn
          retention-days: 90
