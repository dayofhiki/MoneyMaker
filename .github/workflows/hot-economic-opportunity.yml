name: MoneyMaker HOT Economic Opportunity

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/hot-economic-opportunity-request.json'
  workflow_dispatch:
    inputs:
      start_date:
        description: First upstream fit date
        required: true
        default: '2026-01-02'
      end_date:
        description: Last fresh evaluation date
        required: true
        default: '2026-05-20'
      request_id:
        description: Artifact request identifier
        required: true
        default: '140'

permissions:
  contents: read
  actions: read

jobs:
  request:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.read.outputs.enabled }}
      start_date: ${{ steps.read.outputs.start_date }}
      end_date: ${{ steps.read.outputs.end_date }}
      request_id: ${{ steps.read.outputs.request_id }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_START: ${{ inputs.start_date }}
          INPUT_END: ${{ inputs.end_date }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              enabled = True
              start = os.environ["INPUT_START"]
              end = os.environ["INPUT_END"]
              request_id = os.environ["INPUT_REQUEST_ID"]
          else:
              payload = json.loads(
                  Path("victory-trader/research/hot-economic-opportunity-request.json").read_text(
                      encoding="utf-8"
                  )
              )
              enabled = payload.get("operation") == "hot_economic_opportunity_v11"
              start = str(payload.get("start_date", ""))
              end = str(payload.get("end_date", ""))
              request_id = str(payload.get("request_id", ""))
          if enabled and (not start or not end or not request_id):
              raise SystemExit("HOT economic opportunity request is incomplete")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"enabled={'true' if enabled else 'false'}\n")
              handle.write(f"start_date={start}\n")
              handle.write(f"end_date={end}\n")
              handle.write(f"request_id={request_id}\n")
          PY

  learnability:
    if: ${{ needs.request.outputs.enabled == 'true' }}
    needs: request
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      MASSIVE_S3_ACCESS_KEY: ${{ secrets.MASSIVE_S3_ACCESS_KEY }}
      MASSIVE_S3_SECRET_KEY: ${{ secrets.MASSIVE_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'

      - name: Test HOT economic opportunity probe
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q \
            tests/test_hot_economic_opportunity.py \
            tests/test_hot_entry_economics.py \
            tests/test_active_transport_integrated_hierarchy.py \
            tests/test_observation_transport.py

      - name: Restore market-wide Flat File cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-hot-opportunity-flatfiles-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-explicit-integrated-flatfiles-${{ runner.os }}-
            moneymaker-active-integrated-flatfiles-${{ runner.os }}-

      - name: Restore one-second REST cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-hot-opportunity-second-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-explicit-integrated-second-${{ runner.os }}-
            moneymaker-active-integrated-second-${{ runner.os }}-

      - name: Run fresh HOT economic-opportunity learnability
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.hot_economic_opportunity \
            "${{ needs.request.outputs.start_date }}" \
            "${{ needs.request.outputs.end_date }}" \
            --output artifacts/hot-economic-opportunity-v11.parquet \
            --summary artifacts/hot-economic-opportunity-v11.json \
            | tee artifacts/hot-economic-opportunity-v11.log
          test -s artifacts/hot-economic-opportunity-v11.parquet
          test -s artifacts/hot-economic-opportunity-v11.json

      - name: Save one-second REST cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-hot-opportunity-second-${{ runner.os }}-${{ github.run_id }}

      - name: Save market-wide Flat File cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-hot-opportunity-flatfiles-${{ runner.os }}-${{ github.run_id }}

      - name: Upload HOT economic opportunity audit
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-hot-economic-opportunity-v11-${{ needs.request.outputs.request_id }}
          path: |
            victory-trader/artifacts/hot-economic-opportunity-v11.parquet
            victory-trader/artifacts/hot-economic-opportunity-v11.json
            victory-trader/artifacts/hot-economic-opportunity-v11.log
          if-no-files-found: error
          retention-days: 90
