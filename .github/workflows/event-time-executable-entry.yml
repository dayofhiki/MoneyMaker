name: MoneyMaker Event Time Executable Entry

on:
  workflow_dispatch:
  push:
    branches:
      - research/event-time-executable-entry-215
    paths:
      - 'victory-trader/research/event-time-executable-entry-request.json'
      - 'victory-trader/src/victory_trader/event_time_executable_entry.py'
      - 'victory-trader/tests/test_event_time_executable_entry.py'
      - '.github/workflows/event-time-executable-entry.yml'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: victory-trader
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical stack
        run: python -m pip install -e '.[dev]' -c research/request214-requirements.txt
      - name: Check code and event-time contract
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_event_time_executable_entry.py tests/test_executable_recurrent_entry.py
      - name: Download fit and calibration inputs
        uses: actions/download-artifact@v4
        with:
          pattern: request171-rich-second-*
          path: victory-trader/prepared/rich
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36033120106
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download already opened development block
        uses: actions/download-artifact@v4
        with:
          pattern: request178-fresh-*
          path: victory-trader/prepared/fresh
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36038233507
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate request 215
        run: |
          set -o pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          python -m victory_trader.event_time_executable_entry \
            --fit-positions prepared/rich/fit-rich-second.parquet \
            --calibration-positions prepared/rich/calibration-rich-second.parquet \
            --fresh-dir prepared/fresh \
            --output artifacts/request215.json \
            | tee artifacts/request215.log
      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-event-time-executable-entry-215
          path: |
            victory-trader/artifacts/request215.json
            victory-trader/artifacts/request215-states.parquet
            victory-trader/artifacts/request215-decisions.parquet
            victory-trader/artifacts/request215.log
            victory-trader/artifacts/source-sha.txt
          if-no-files-found: error
          retention-days: 90
