name: MoneyMaker R329 Independent Cached Replay

on:
  push:
    branches: [research/accumulated-current-evidence-329]
    paths: ['.github/workflows/accumulated-current-evidence-329.yml']

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: victory-trader
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' numpy==2.4.6 pandas==3.0.6 scipy==1.17.1 scikit-learn==1.9.1 pyarrow==25.0.1 pytest==9.1.1 ruff==0.16.10
      - name: Critical checks and causal regressions
        run: |
          ruff check src tests research/verify_request329.py --select E4,E7,E9,F
          pytest -q tests/test_accumulated_current_evidence_momentum.py tests/test_gated_trajectory_residual_momentum.py tests/test_observed_path_innovation_momentum.py tests/test_prediction_only_sequence_momentum.py tests/test_elapsed_state_rate_momentum.py tests/test_latent_state_evolution_momentum.py tests/test_trajectory_admission_momentum.py tests/test_nearby_state_momentum.py tests/test_within_episode_momentum.py tests/test_state_evolution_momentum.py tests/test_context_interaction_momentum.py tests/test_continuous_population_momentum.py tests/test_compact_momentum_representation.py
      - uses: actions/download-artifact@v4
        with:
          name: moneymaker-independent-request-319
          path: victory-trader/prepared/official319
          run-id: 37588633963
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: moneymaker-independent-request-321
          path: victory-trader/prepared/official321
          run-id: 37594980002
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: moneymaker-independent-request-325
          path: victory-trader/prepared/official325
          run-id: 37618872764
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: moneymaker-independent-request-326
          path: victory-trader/prepared/official326
          run-id: 37624854775
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: moneymaker-independent-request-327
          path: victory-trader/prepared/official327
          run-id: 37652470621
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: moneymaker-independent-request-327-feature-history
          path: victory-trader/prepared/official327-secondary
          run-id: 37652470621
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: moneymaker-independent-request-328
          path: victory-trader/prepared/official328
          run-id: 37657314310
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: moneymaker-independent-request-328-feature-history
          path: victory-trader/prepared/official328-secondary
          run-id: 37657314310
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge authenticated predecessor tables
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          for n in (327, 328):
              for source in Path(f'prepared/official{n}-secondary').iterdir():
                  target = Path(f'prepared/official{n}')/source.name
                  if target.exists():
                      assert source.read_bytes() == target.read_bytes(), source.name
                  else:
                      shutil.copyfile(source, target)
          PY
      - name: One fixed offline experiment
        run: |
          set -o pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          python --version > artifacts/environment.txt
          python -m pip freeze >> artifacts/environment.txt
          python -m victory_trader.accumulated_current_evidence_momentum \
            --previous prepared --pinned-inputs research/request329-inputs.json \
            --output-dir artifacts | tee artifacts/request329.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneymaker-independent-request-329
          path: |
            victory-trader/artifacts/
            !victory-trader/artifacts/request329-training-states.parquet
            !victory-trader/artifacts/request329-evidence-history.parquet
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneymaker-independent-request-329-evidence
          path: |
            victory-trader/artifacts/request329-training-states.parquet
            victory-trader/artifacts/request329-evidence-history.parquet
            victory-trader/artifacts/source-sha.txt
            victory-trader/artifacts/environment.txt
          if-no-files-found: warn
          retention-days: 90
