name: MoneyMaker Fresh 30m Economic Viability

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/fresh-30m-economic-viability-request.json'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Test request 190
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_fresh_30m_economic_viability.py

      - name: Download Request 163 first-HOT history
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-extended-history-economic-opportunity-v10-163
          path: victory-trader/prepared/history
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Request 171 fit/calibration POSITION phases
        uses: actions/download-artifact@v4
        with:
          pattern: request171-rich-second-*
          path: victory-trader/prepared/rich
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36033120106
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Request 178 fresh POSITION shards
        uses: actions/download-artifact@v4
        with:
          pattern: request178-fresh-*
          path: victory-trader/prepared/fresh
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36038233507
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Request 184 fresh entry states
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-decomposed-cost-aware-entry-surplus-v10-184
          path: victory-trader/prepared/request184
          repository: dayofhiki/MoneyMaker
          run-id: 36046370233
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate request 190
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.fresh_30m_economic_viability             --history-first-hot prepared/history/extended-history-economic-opportunity-v10.parquet             --fit-positions prepared/rich/fit-rich-second.parquet             --calibration-positions prepared/rich/calibration-rich-second.parquet             --fresh-entry-states prepared/request184/decomposed-cost-aware-entry-surplus-v10.parquet             --fresh-dir prepared/fresh             --output artifacts/fresh-30m-economic-viability-v10.json             --rows-output artifacts/fresh-30m-economic-viability-v10.parquet             | tee artifacts/fresh-30m-economic-viability-v10.log

      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-fresh-30m-economic-viability-v10-190
          path: |
            victory-trader/artifacts/fresh-30m-economic-viability-v10.json
            victory-trader/artifacts/fresh-30m-economic-viability-v10.parquet
            victory-trader/artifacts/fresh-30m-economic-viability-v10.log
          if-no-files-found: error
          retention-days: 90
