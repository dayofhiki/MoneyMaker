name: MoneyMaker Causal Relative Tail

on:
  push:
    branches:
      - research/causal-relative-tail-238
    paths:
      - 'victory-trader/research/causal-relative-tail-request.json'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical stack
        run: python -m pip install -e '.[dev]' -c research/request214-requirements.txt
      - name: Check request238 relative-tail contract
        run: ruff check src tests --select E4,E7,E9,F
      - name: Download frozen Request233 rows
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-economic-full-hot-admission-233
          path: victory-trader/prepared/request233
          repository: dayofhiki/MoneyMaker
          run-id: 36251239308
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate request238
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.causal_relative_tail \
            --scored-hot prepared/request233/request233-full-hot-states.parquet \
            --output artifacts/request238.json \
            | tee artifacts/request238.log
      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-causal-relative-tail-238
          path: |
            victory-trader/artifacts/request238.json
            victory-trader/artifacts/request238.log
          if-no-files-found: error
          retention-days: 90
