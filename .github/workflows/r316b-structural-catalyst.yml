name: R316B Independent Structural Catalyst Cohort
on:
  push:
    branches:
      - research/structural-catalyst-cohort-316b
permissions:
  contents: read
  actions: read
jobs:
  cohort:
    if: contains(github.event.head_commit.message, '[run-r316b]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen research stack
        run: python -m pip install -e '.[dev]' -c research/request214-requirements.txt
      - name: Verify implementation
        run: |
          python -m ruff check src tests --select E4,E7,E9,F
          python -m pytest -q tests/test_structural_catalyst_cohort.py tests/test_event_heterogeneity_audit.py tests/test_preentry_momentum_observability.py tests/test_massive_client.py
      - name: Restore exact first-run provider census and raw history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prepared/r316b-first data/cache
          gh run download 37458825600 -n moneymaker-r316b-independent -D prepared/r316b-first -R dayofhiki/MoneyMaker
          python - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          root = Path('prepared/r316b-first')
          hashes = json.loads((root/'artifact-hashes.json').read_text())
          for name, expected in hashes.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest() == expected, name
          assert hashes['event-census.json'] == '36cc5f21ff36898faf71d2ca76f1682d2e62d8cd6d6dcb96a2789696b355c779'
          target = Path('data/cache').resolve()
          with tarfile.open(root/'raw-evidence.tar.gz') as archive:
              for item in archive.getmembers():
                  assert (target/item.name).resolve().is_relative_to(target)
                  assert not item.issym() and not item.islnk()
              archive.extractall(target)
          PY
      - name: Freeze independent event and matched control membership
        run: |
          set -euo pipefail
          mkdir -p artifacts/r316b
          git rev-parse HEAD > artifacts/r316b/source-sha.txt
          cp research/request316b-plan.md artifacts/r316b/
          python -m victory_trader.structural_catalyst_cohort --phase build --output-dir artifacts/r316b \
            --frozen-census prepared/r316b-first/event-census.json \
            --expected-census-sha256 36cc5f21ff36898faf71d2ca76f1682d2e62d8cd6d6dcb96a2789696b355c779 2>&1 | tee artifacts/r316b/build.log
      - name: Label only the frozen membership
        run: |
          set -euo pipefail
          python -m victory_trader.structural_catalyst_cohort --phase label --output-dir artifacts/r316b 2>&1 | tee artifacts/r316b/label.log
      - name: Verify original structural results are unchanged
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          original = Path('prepared/r316b-first')
          current = Path('artifacts/r316b')
          before = pd.read_parquet(original/'outcomes.parquet')
          after = pd.read_parquet(current/'outcomes.parquet')
          after = after.loc[after.family.str.startswith('split_')].copy()
          columns = [c for c in before if c != 'categories']
          keys = ['anchor_id', 'ticker', 'arm']
          pd.testing.assert_frame_equal(before[columns].sort_values(keys).reset_index(drop=True), after[columns].sort_values(keys).reset_index(drop=True), check_exact=True, check_dtype=False)
          old = json.loads((original/'request316b.json').read_text())
          new = json.loads((current/'request316b.json').read_text())
          for family in old['reports']:
              if family.startswith('split_'):
                  assert new['reports'][family] == old['reports'][family], family
          (current/'recovery-integrity.json').write_text(json.dumps({'original_run': 37458825600, 'structural_rows_exact': len(before), 'structural_reports_exact': 4, 'original_census_reused': new['build']['original_census_reused'], 'seed_digest': new['build']['SEC']['seed_sha256']}, indent=2)+'\n')
          PY
      - name: Archive evidence and headers
        if: always()
        run: |
          mkdir -p artifacts/r316b
          if [ -d data/cache/r316b ]; then tar -czf artifacts/r316b/raw-evidence.tar.gz -C data/cache r316b; fi
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('artifacts/r316b')
          hashes = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.iterdir()) if p.is_file()}
          (root/'artifact-hashes.json').write_text(json.dumps(hashes, indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneymaker-r316b-independent
          path: victory-trader/artifacts/r316b/**
          if-no-files-found: warn
          retention-days: 90
