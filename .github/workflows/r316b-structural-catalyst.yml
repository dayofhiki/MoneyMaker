name: R316B Cached Reproduction and Integrity Closeout
on:
  push:
    branches:
      - research/structural-catalyst-cohort-316b
permissions:
  contents: read
  actions: read
jobs:
  closeout:
    if: contains(github.event.head_commit.message, '[verify-r316b]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: victory-trader
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen research stack
        run: python -m pip install -e '.[dev]' -c research/request214-requirements.txt
      - name: Verify integrity implementation
        run: |
          python -m ruff check src tests --select E4,E7,E9,F
          python -m pytest -q tests/test_structural_catalyst_cohort.py tests/test_event_heterogeneity_audit.py tests/test_preentry_momentum_observability.py tests/test_massive_client.py
      - name: Download frozen source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prepared/r316b-first prepared/r316b-recovery artifacts/r316b-closeout
          gh run download 37458825600 -n moneymaker-r316b-independent -D prepared/r316b-first -R dayofhiki/MoneyMaker
          gh run download 37459997869 -n moneymaker-r316b-independent -D prepared/r316b-recovery -R dayofhiki/MoneyMaker
      - name: Reproduce all labels and reports with market network forbidden
        run: |
          python - <<'PY'
          import hashlib, json, shutil, tarfile
          from pathlib import Path
          import pandas as pd
          from victory_trader import structural_catalyst_cohort as experiment
          from victory_trader.massive_client import MassiveClient
          original, recovery = Path('prepared/r316b-first'), Path('prepared/r316b-recovery')
          output = Path('artifacts/r316b-closeout')
          for root in (original, recovery):
              for name, expected in json.loads((root/'artifact-hashes.json').read_text()).items():
                  assert hashlib.sha256((root/name).read_bytes()).hexdigest() == expected, name
          assert (recovery/'source-sha.txt').read_text().strip() == '492874e8ce03de421a5831fa6c9e0d980e849bc4'
          assert hashlib.sha256((recovery/'event-census.json').read_bytes()).hexdigest() == hashlib.sha256((original/'event-census.json').read_bytes()).hexdigest() == '36cc5f21ff36898faf71d2ca76f1682d2e62d8cd6d6dcb96a2789696b355c779'
          old = json.loads((original/'request316b.json').read_text())
          new = json.loads((recovery/'request316b.json').read_text())
          assert hashlib.sha256((recovery/'frozen-manifest.parquet').read_bytes()).hexdigest() == new['manifest_sha256']
          before, after = pd.read_parquet(original/'outcomes.parquet'), pd.read_parquet(recovery/'outcomes.parquet')
          audit = experiment.verify_preserved_structural(before, after, old['reports'], new['reports'])
          raw = recovery/'raw'
          raw.mkdir(exist_ok=True)
          with tarfile.open(recovery/'raw-evidence.tar.gz') as archive:
              for item in archive.getmembers():
                  assert (raw/item.name).resolve().is_relative_to(raw.resolve()) and not item.issym() and not item.islnk()
              archive.extractall(raw)
          client = MassiveClient('cache-only-reproduction', cache_dir=raw/'r316b/massive')
          misses = []
          def cached(path, params=None, *, use_cache=True):
              query = dict(params or {})
              query.pop('apiKey', None)
              value = client._read_cache(client._cache_path(path, query))
              if value is None:
                  misses.append(path)
                  raise AssertionError('raw cache miss; market network forbidden')
              return value
          client._get = cached
          labels = experiment.label_manifest(pd.read_parquet(recovery/'frozen-manifest.parquet'), client)
          pd.testing.assert_frame_equal(after, labels, check_exact=True)
          reports = {family: experiment.paired_report(labels, family, new['build']['exact_header_coverage']) for family in new['reports']}
          assert reports == new['reports'] and not misses
          audit.update(source_market_run=37459997869, market_source_sha='492874e8ce03de421a5831fa6c9e0d980e849bc4', outcome_rows_exactly_reproduced=len(labels), all_reports_exactly_reproduced=len(reports), network_requests=client.stats.network_requests, cache_hits=client.stats.cache_hits, cache_misses=misses)
          (output/'closeout-audit.json').write_text(json.dumps(audit, indent=2)+'\n')
          for item in recovery.iterdir():
              if item.is_file():
                  shutil.copy2(item, output/item.name)
          (output/'verification-source-sha.txt').write_text(__import__('subprocess').check_output(['git','rev-parse','HEAD'], text=True))
          print(json.dumps(audit, indent=2))
          print(json.dumps(new, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneymaker-r316b-verified-closeout
          path: victory-trader/artifacts/r316b-closeout/**
          if-no-files-found: warn
          retention-days: 90
