name: MoneyMaker First-HOT Entry Economics

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First fit date
        required: true
        default: '2026-01-02'
      end_date:
        description: Last reused request-138 date
        required: true
        default: '2026-05-13'
      request_id:
        description: Artifact request identifier
        required: true
        default: '139'

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      MASSIVE_S3_ACCESS_KEY: ${{ secrets.MASSIVE_S3_ACCESS_KEY }}
      MASSIVE_S3_SECRET_KEY: ${{ secrets.MASSIVE_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'

      - name: Test first-HOT economics helpers
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q \
            tests/test_hot_entry_economics.py \
            tests/test_active_transport_integrated_hierarchy.py \
            tests/test_observation_transport.py

      - name: Restore market-wide Flat File cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-hot-economics-flatfiles-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-explicit-integrated-flatfiles-${{ runner.os }}-
            moneymaker-active-integrated-flatfiles-${{ runner.os }}-

      - name: Restore one-second REST cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-hot-economics-second-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-explicit-integrated-second-${{ runner.os }}-
            moneymaker-active-integrated-second-${{ runner.os }}-

      - name: Run first-HOT economics diagnostic
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.hot_entry_economics_probe \
            "${{ inputs.start_date }}" \
            "${{ inputs.end_date }}" \
            --output artifacts/hot-entry-economics-v10.parquet \
            --summary artifacts/hot-entry-economics-v10.json \
            | tee artifacts/hot-entry-economics-v10.log
          test -s artifacts/hot-entry-economics-v10.parquet
          test -s artifacts/hot-entry-economics-v10.json

      - name: Upload first-HOT economics audit
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-hot-entry-economics-v10-${{ inputs.request_id }}
          path: |
            victory-trader/artifacts/hot-entry-economics-v10.parquet
            victory-trader/artifacts/hot-entry-economics-v10.json
            victory-trader/artifacts/hot-entry-economics-v10.log
          if-no-files-found: error
          retention-days: 90
