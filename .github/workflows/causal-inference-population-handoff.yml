name: MoneyMaker Causal Inference Population Handoff

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/causal-inference-population-handoff-request.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      MASSIVE_S3_ACCESS_KEY: ${{ secrets.MASSIVE_S3_ACCESS_KEY }}
      MASSIVE_S3_SECRET_KEY: ${{ secrets.MASSIVE_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'

      - name: Test causal inference population
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q \
            tests/test_market_wide_focus_hazard.py \
            tests/test_active_transport_integrated_hierarchy.py \
            tests/test_hierarchical_attention_runtime.py \
            tests/test_second_path_attention_probe.py

      - name: Restore market-wide Flat File cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-causal-population-flatfiles-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-position-observability-v11-flatfiles-${{ runner.os }}-
            moneymaker-hot-opportunity-flatfiles-${{ runner.os }}-
            moneymaker-explicit-integrated-flatfiles-${{ runner.os }}-

      - name: Restore one-second REST cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-causal-population-second-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-position-observability-v11-second-${{ runner.os }}-
            moneymaker-hot-opportunity-second-${{ runner.os }}-
            moneymaker-explicit-integrated-second-${{ runner.os }}-

      - name: Run request 146 causal inference population audit
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.causal_inference_population_handoff \
            2026-01-02 2026-05-13 \
            --output artifacts/causal-inference-population-handoff-v10.parquet \
            --summary artifacts/causal-inference-population-handoff-v10.json \
            | tee artifacts/causal-inference-population-handoff-v10.log

      - name: Upload request 146 audit
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-causal-inference-population-handoff-v10-146
          path: |
            victory-trader/artifacts/causal-inference-population-handoff-v10.parquet
            victory-trader/artifacts/causal-inference-population-handoff-v10.json
            victory-trader/artifacts/causal-inference-population-handoff-v10.log
          if-no-files-found: error
          retention-days: 90

      - name: Save one-second REST cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-causal-population-second-${{ runner.os }}-${{ github.run_id }}

      - name: Save market-wide Flat File cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-causal-population-flatfiles-${{ runner.os }}-${{ github.run_id }}
