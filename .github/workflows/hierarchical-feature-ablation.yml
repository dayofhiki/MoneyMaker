name: MoneyMaker Hierarchical Feature Ablation

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/hierarchical-feature-ablation-request.json'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      MASSIVE_S3_ACCESS_KEY: ${{ secrets.MASSIVE_S3_ACCESS_KEY }}
      MASSIVE_S3_SECRET_KEY: ${{ secrets.MASSIVE_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'

      - name: Test request 160
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q \
            tests/test_hierarchical_feature_ablation.py \
            tests/test_hierarchical_active_features.py \
            tests/test_focus180_temporal_retrain.py

      - name: Restore market-wide Flat File cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-hierarchical-ablation-flatfiles-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-hierarchical-active-flatfiles-${{ runner.os }}-
            moneymaker-focus180-temporal-flatfiles-${{ runner.os }}-
            moneymaker-focus-cap-frontier-flatfiles-${{ runner.os }}-

      - name: Run request 160
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.hierarchical_feature_ablation \
            2026-01-02 2026-05-28 \
            --summary artifacts/hierarchical-feature-ablation-v10.json \
            | tee artifacts/hierarchical-feature-ablation-v10.log

      - name: Upload request 160 artifact
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-hierarchical-feature-ablation-v10-160
          path: |
            victory-trader/artifacts/hierarchical-feature-ablation-v10.json
            victory-trader/artifacts/hierarchical-feature-ablation-v10.log
          if-no-files-found: error
          retention-days: 90

      - name: Save market-wide Flat File cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-hierarchical-ablation-flatfiles-${{ runner.os }}-${{ github.run_id }}
