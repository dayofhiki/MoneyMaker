name: MoneyMaker Research Request

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/research-request.json'

permissions:
  contents: read
  actions: read

jobs:
  request:
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.read.outputs.operation }}
      start_date: ${{ steps.read.outputs.start_date }}
      end_date: ${{ steps.read.outputs.end_date }}
      chunk_days: ${{ steps.read.outputs.chunk_days }}
      max_candidates: ${{ steps.read.outputs.max_candidates }}
      annotate_halts: ${{ steps.read.outputs.annotate_halts }}
      request_id: ${{ steps.read.outputs.request_id }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path("victory-trader/research/research-request.json").read_text(
                  encoding="utf-8"
              )
          )

          operation = str(payload.get("operation", "research_month"))
          required = ("request_id",)
          if operation == "research_month":
              required += ("start_date", "end_date", "chunk_days", "annotate_halts")
          elif operation not in {"candidate_v2_development", "catalyst_probe", "state_trader_research", "state_value_model", "dynamic_state_policy", "nbbo_probe", "state_ev_risk", "quote_flatfile_probe", "dynamic_state_policy_v03", "state_oracle", "state_breadth_ev_risk", "state_action_value", "state_action_risk", "state_entry_ranker", "state_wait_value", "state_one_step_stop", "state_rank_turn", "state_rank_residual_fusion", "state_log_growth", "short_volume_probe", "state_short_volume_action_value", "relative_short_volume_context_probe", "state_relative_short_volume_action_value", "state_eight_k_action_value", "short_interest_probe", "state_multi_source_interaction", "state_robust_median_action_value", "sec_8k_probe"}:
              raise SystemExit(f"unsupported research operation: {operation}")

          missing = [key for key in required if key not in payload]
          if missing:
              raise SystemExit(f"research request missing keys: {missing}")

          values = {
              "operation": operation,
              "request_id": str(payload["request_id"]),
              "start_date": str(payload.get("start_date", "")),
              "end_date": str(payload.get("end_date", "")),
              "chunk_days": str(payload.get("chunk_days", "")),
              "max_candidates": str(payload.get("max_candidates", "")),
              "annotate_halts": "true" if bool(payload.get("annotate_halts", True)) else "false",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          print(
              "Research request",
              values["request_id"],
              values["operation"],
              values["start_date"],
              values["end_date"],
          )
          PY

  research:
    if: ${{ needs.request.outputs.operation == 'research_month' }}
    needs: request
    uses: ./.github/workflows/victory-trader-research.yml
    with:
      start_date: ${{ needs.request.outputs.start_date }}
      end_date: ${{ needs.request.outputs.end_date }}
      chunk_days: ${{ needs.request.outputs.chunk_days }}
      max_candidates: ${{ needs.request.outputs.max_candidates }}
      annotate_halts: ${{ needs.request.outputs.annotate_halts == 'true' }}
    secrets: inherit

  candidate-v2-development:
    if: ${{ needs.request.outputs.operation == 'candidate_v2_development' }}
    needs: request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'

      - name: Test Candidate v2 research code
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_candidate_v2_research.py tests/test_candidate_v2_exit_research.py tests/test_candidate_v2_entry_research.py

      - name: Download January enriched development data
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-research-analysis-35309972523
          path: victory-trader/dev-data/jan
          github-token: ${{ github.token }}
          repository: dayofhiki/MoneyMaker
          run-id: '35312367550'

      - name: Download February enriched development data
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-edge-discovery-35290389374
          path: victory-trader/dev-data/feb
          github-token: ${{ github.token }}
          repository: dayofhiki/MoneyMaker
          run-id: '35291798289'

      - name: Download March enriched development data
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-enriched-2026-03-v05
          path: victory-trader/dev-data/mar
          github-token: ${{ github.token }}
          repository: dayofhiki/MoneyMaker
          run-id: '35284485307'

      - name: Run leave-one-month-out Candidate v2 development
        shell: bash
        run: |
          mkdir -p artifacts
          JAN="$(find dev-data/jan -name research-enriched.parquet -print -quit)"
          FEB="$(find dev-data/feb -name research-enriched.parquet -print -quit)"
          MAR="$(find dev-data/mar -name research-enriched.parquet -print -quit)"
          test -n "$JAN" || { echo "January enriched dataset not found"; exit 1; }
          test -n "$FEB" || { echo "February enriched dataset not found"; exit 1; }
          test -n "$MAR" || { echo "March enriched dataset not found"; exit 1; }

          python -m victory_trader.candidate_v2_research \
            --dataset "2026-01=$JAN" \
            --dataset "2026-02=$FEB" \
            --dataset "2026-03=$MAR" \
            --report artifacts/candidate-v2-development.txt \
            --details-csv artifacts/candidate-v2-details.csv \
            --summary-csv artifacts/candidate-v2-summary.csv \
            | tee artifacts/candidate-v2-development.log

      - name: Run Candidate v2 barrier exit research
        shell: bash
        run: |
          JAN="$(find dev-data/jan -name research-enriched.parquet -print -quit)"
          FEB="$(find dev-data/feb -name research-enriched.parquet -print -quit)"
          MAR="$(find dev-data/mar -name research-enriched.parquet -print -quit)"
          python -m victory_trader.candidate_v2_exit_research \
            --dataset "2026-01=$JAN" \
            --dataset "2026-02=$FEB" \
            --dataset "2026-03=$MAR" \
            --report artifacts/candidate-v2-exit-research.txt \
            --details-csv artifacts/candidate-v2-exit-details.csv \
            --summary-csv artifacts/candidate-v2-exit-summary.csv \
            | tee artifacts/candidate-v2-exit-research.log

      - name: Run Candidate v2 entry timing research
        shell: bash
        run: |
          JAN="$(find dev-data/jan -name research-enriched.parquet -print -quit)"
          FEB="$(find dev-data/feb -name research-enriched.parquet -print -quit)"
          MAR="$(find dev-data/mar -name research-enriched.parquet -print -quit)"
          python -m victory_trader.candidate_v2_entry_research \
            --dataset "2026-01=$JAN" \
            --dataset "2026-02=$FEB" \
            --dataset "2026-03=$MAR" \
            --report artifacts/candidate-v2-entry-research.txt \
            --details-csv artifacts/candidate-v2-entry-details.csv \
            --summary-csv artifacts/candidate-v2-entry-summary.csv \
            | tee artifacts/candidate-v2-entry-research.log

      - name: Upload Candidate v2 development artifact
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-candidate-v2-development-${{ needs.request.outputs.request_id }}
          path: |
            victory-trader/artifacts/candidate-v2-development.txt
            victory-trader/artifacts/candidate-v2-development.log
            victory-trader/artifacts/candidate-v2-details.csv
            victory-trader/artifacts/candidate-v2-summary.csv
            victory-trader/artifacts/candidate-v2-exit-research.txt
            victory-trader/artifacts/candidate-v2-exit-research.log
            victory-trader/artifacts/candidate-v2-exit-details.csv
            victory-trader/artifacts/candidate-v2-exit-summary.csv
            victory-trader/artifacts/candidate-v2-entry-research.txt
            victory-trader/artifacts/candidate-v2-entry-research.log
            victory-trader/artifacts/candidate-v2-entry-details.csv
            victory-trader/artifacts/candidate-v2-entry-summary.csv
          if-no-files-found: error
          retention-days: 90

  catalyst-probe:
    if: ${{ needs.request.outputs.operation == 'catalyst_probe' }}
    needs: request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'

      - name: Test catalyst dependencies
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_massive_client.py tests/test_candidate_v2_research.py tests/test_candidate_v2_entry_research.py

      - name: Download January enriched development data
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-research-analysis-35309972523
          path: victory-trader/dev-data/jan
          github-token: ${{ github.token }}
          repository: dayofhiki/MoneyMaker
          run-id: '35312367550'

      - name: Download February enriched development data
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-edge-discovery-35290389374
          path: victory-trader/dev-data/feb
          github-token: ${{ github.token }}
          repository: dayofhiki/MoneyMaker
          run-id: '35291798289'

      - name: Download March enriched development data
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-enriched-2026-03-v05
          path: victory-trader/dev-data/mar
          github-token: ${{ github.token }}
          repository: dayofhiki/MoneyMaker
          run-id: '35284485307'

      - name: Probe point-in-time news and ticker details
        shell: bash
        run: |
          mkdir -p artifacts
          JAN="$(find dev-data/jan -name research-enriched.parquet -print -quit)"
          FEB="$(find dev-data/feb -name research-enriched.parquet -print -quit)"
          MAR="$(find dev-data/mar -name research-enriched.parquet -print -quit)"
          python -m victory_trader.catalyst_supply_probe \
            --dataset "2026-01=$JAN" \
            --dataset "2026-02=$FEB" \
            --dataset "2026-03=$MAR" \
            --report artifacts/catalyst-supply-probe.txt \
            --csv artifacts/catalyst-supply-probe.csv \
            | tee artifacts/catalyst-supply-probe.log

      - name: Upload catalyst probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-catalyst-probe-${{ needs.request.outputs.request_id }}
          path: |
            victory-trader/artifacts/catalyst-supply-probe.txt
            victory-trader/artifacts/catalyst-supply-probe.log
            victory-trader/artifacts/catalyst-supply-probe.csv
          if-no-files-found: error
          retention-days: 90

  state-trader-research:
    if: ${{ needs.request.outputs.operation == 'state_trader_research' }}
    needs: request
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_S3_ACCESS_KEY: ${{ secrets.MASSIVE_S3_ACCESS_KEY }}
      MASSIVE_S3_SECRET_KEY: ${{ secrets.MASSIVE_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'

      - name: Test state trader modules
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_state_panel.py tests/test_state_discovery.py

      - name: Restore reusable Flat File cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-state-v01-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-state-v01-${{ runner.os }}-
            moneymaker-discovery-v05-${{ runner.os }}-

      - name: Download January enriched development data
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-research-analysis-35309972523
          path: victory-trader/dev-data/jan
          github-token: ${{ github.token }}
          repository: dayofhiki/MoneyMaker
          run-id: '35312367550'

      - name: Download February enriched development data
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-edge-discovery-35290389374
          path: victory-trader/dev-data/feb
          github-token: ${{ github.token }}
          repository: dayofhiki/MoneyMaker
          run-id: '35291798289'

      - name: Download March enriched development data
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-enriched-2026-03-v05
          path: victory-trader/dev-data/mar
          github-token: ${{ github.token }}
          repository: dayofhiki/MoneyMaker
          run-id: '35284485307'

      - name: Build January runner state panel
        shell: bash
        run: |
          mkdir -p data/state artifacts
          SRC="$(find dev-data/jan -name research-enriched.parquet -print -quit)"
          test -n "$SRC" || { echo "January enriched dataset not found"; exit 1; }
          python -m victory_trader.state_panel "$SRC" \
            --output data/state/state-2026-01.parquet \
            | tee artifacts/state-panel-2026-01.log

      - name: Build February runner state panel
        shell: bash
        run: |
          SRC="$(find dev-data/feb -name research-enriched.parquet -print -quit)"
          test -n "$SRC" || { echo "February enriched dataset not found"; exit 1; }
          python -m victory_trader.state_panel "$SRC" \
            --output data/state/state-2026-02.parquet \
            | tee artifacts/state-panel-2026-02.log

      - name: Build March runner state panel
        shell: bash
        run: |
          SRC="$(find dev-data/mar -name research-enriched.parquet -print -quit)"
          test -n "$SRC" || { echo "March enriched dataset not found"; exit 1; }
          python -m victory_trader.state_panel "$SRC" \
            --output data/state/state-2026-03.parquet \
            | tee artifacts/state-panel-2026-03.log

      - name: Run pre-specified state discovery
        shell: bash
        run: |
          python -m victory_trader.state_discovery \
            --dataset "2026-01=data/state/state-2026-01.parquet" \
            --dataset "2026-02=data/state/state-2026-02.parquet" \
            --dataset "2026-03=data/state/state-2026-03.parquet" \
            --report artifacts/state-discovery-v01.txt \
            --details-csv artifacts/state-discovery-details.csv \
            --stability-csv artifacts/state-discovery-stability.csv \
            | tee artifacts/state-discovery-v01.log

      - name: Save reusable state Flat File cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-state-v01-${{ runner.os }}-${{ github.run_id }}

      - name: Upload state trader research artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-state-trader-v01-${{ needs.request.outputs.request_id }}
          path: |
            victory-trader/data/state/state-2026-01.parquet
            victory-trader/data/state/state-2026-02.parquet
            victory-trader/data/state/state-2026-03.parquet
            victory-trader/artifacts/state-panel-2026-01.log
            victory-trader/artifacts/state-panel-2026-02.log
            victory-trader/artifacts/state-panel-2026-03.log
            victory-trader/artifacts/state-discovery-v01.txt
            victory-trader/artifacts/state-discovery-v01.log
            victory-trader/artifacts/state-discovery-details.csv
            victory-trader/artifacts/state-discovery-stability.csv
          if-no-files-found: warn
          retention-days: 90

  state-value-model:
    if: ${{ needs.request.outputs.operation == 'state_value_model' }}
    needs: request
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'

      - name: Test state value model
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_state_value_model.py

      - name: Download State Trader v0.1 panels
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-state-trader-v01-8
          path: victory-trader/state-artifact
          github-token: ${{ github.token }}
          repository: dayofhiki/MoneyMaker
          run-id: '35322182758'

      - name: Run leave-one-month-out state action-value model
        shell: bash
        run: |
          mkdir -p artifacts
          JAN="$(find state-artifact -name state-2026-01.parquet -print -quit)"
          FEB="$(find state-artifact -name state-2026-02.parquet -print -quit)"
          MAR="$(find state-artifact -name state-2026-03.parquet -print -quit)"
          test -n "$JAN" || { echo "January state panel not found"; exit 1; }
          test -n "$FEB" || { echo "February state panel not found"; exit 1; }
          test -n "$MAR" || { echo "March state panel not found"; exit 1; }

          python -m victory_trader.state_value_model \
            --dataset "2026-01=$JAN" \
            --dataset "2026-02=$FEB" \
            --dataset "2026-03=$MAR" \
            --report artifacts/state-value-model-v01.txt \
            --details-csv artifacts/state-value-model-details.csv \
            --stability-csv artifacts/state-value-model-stability.csv \
            --scores-csv artifacts/state-value-model-top-scores.csv \
            | tee artifacts/state-value-model-v01.log

      - name: Upload State Action-Value Model artifact
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-state-value-v01-${{ needs.request.outputs.request_id }}
          path: |
            victory-trader/artifacts/state-value-model-v01.txt
            victory-trader/artifacts/state-value-model-v01.log
            victory-trader/artifacts/state-value-model-details.csv
            victory-trader/artifacts/state-value-model-stability.csv
            victory-trader/artifacts/state-value-model-top-scores.csv
          if-no-files-found: error
          retention-days: 90


  dynamic-state-policy:
    if: ${{ needs.request.outputs.operation == 'dynamic_state_policy' }}
    needs: request
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'

      - name: Test dynamic state policy
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_state_value_model.py tests/test_dynamic_state_policy.py

      - name: Download State Trader v0.1 panels
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-state-trader-v01-8
          path: victory-trader/state-artifact
          github-token: ${{ github.token }}
          repository: dayofhiki/MoneyMaker
          run-id: '35322182758'

      - name: Run Dynamic State Policy v0.2
        shell: bash
        run: |
          mkdir -p artifacts
          JAN="$(find state-artifact -name state-2026-01.parquet -print -quit)"
          FEB="$(find state-artifact -name state-2026-02.parquet -print -quit)"
          MAR="$(find state-artifact -name state-2026-03.parquet -print -quit)"
          test -n "$JAN" || { echo "January state panel not found"; exit 1; }
          test -n "$FEB" || { echo "February state panel not found"; exit 1; }
          test -n "$MAR" || { echo "March state panel not found"; exit 1; }

          python -m victory_trader.dynamic_state_policy \
            --dataset "2026-01=$JAN" \
            --dataset "2026-02=$FEB" \
            --dataset "2026-03=$MAR" \
            --report artifacts/dynamic-state-policy-v02.txt \
            --metrics-csv artifacts/dynamic-state-policy-v02-metrics.csv \
            --trades-csv artifacts/dynamic-state-policy-v02-trades.csv \
            --equity-csv artifacts/dynamic-state-policy-v02-equity.csv \
            | tee artifacts/dynamic-state-policy-v02.log

      - name: Upload Dynamic State Policy artifact
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-dynamic-state-policy-v02-${{ needs.request.outputs.request_id }}
          path: |
            victory-trader/artifacts/dynamic-state-policy-v02.txt
            victory-trader/artifacts/dynamic-state-policy-v02.log
            victory-trader/artifacts/dynamic-state-policy-v02-metrics.csv
            victory-trader/artifacts/dynamic-state-policy-v02-trades.csv
            victory-trader/artifacts/dynamic-state-policy-v02-equity.csv
          if-no-files-found: error
          retention-days: 90

  nbbo-probe:
    if: ${{ needs.request.outputs.operation == 'nbbo_probe' }}
    needs: request
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'

      - name: Test NBBO probe
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_massive_client.py tests/test_execution_nbbo_probe.py

      - name: Download Dynamic State Policy v0.2 trades
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-dynamic-state-policy-v02-11
          path: victory-trader/dynamic-v02
          github-token: ${{ github.token }}
          repository: dayofhiki/MoneyMaker
          run-id: '35338854045'

      - name: Probe historical NBBO execution
        shell: bash
        run: |
          mkdir -p artifacts
          TRADES="$(find dynamic-v02 -name dynamic-state-policy-v02-trades.csv -print -quit)"
          test -n "$TRADES" || { echo "Dynamic v0.2 trades CSV not found"; exit 1; }
          python -m victory_trader.execution_nbbo_probe "$TRADES" \
            --report artifacts/nbbo-probe-v01.txt \
            --details-csv artifacts/nbbo-probe-v01-details.csv \
            --summary-csv artifacts/nbbo-probe-v01-summary.csv \
            | tee artifacts/nbbo-probe-v01.log

      - name: Upload NBBO probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-nbbo-probe-v01-${{ needs.request.outputs.request_id }}
          path: |
            victory-trader/artifacts/nbbo-probe-v01.txt
            victory-trader/artifacts/nbbo-probe-v01.log
            victory-trader/artifacts/nbbo-probe-v01-details.csv
            victory-trader/artifacts/nbbo-probe-v01-summary.csv
          if-no-files-found: error
          retention-days: 90

  state-ev-risk:
    if: ${{ needs.request.outputs.operation == 'state_ev_risk' }}
    needs: request
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'

      - name: Test State EV + Risk model
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_state_ev_risk_model.py tests/test_state_value_model.py

      - name: Download State Trader v0.1 panels
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-state-trader-v01-8
