        working-directory: victory-trader
    env:
      MASSIVE_S3_ACCESS_KEY: ${{ secrets.MASSIVE_S3_ACCESS_KEY }}
      MASSIVE_S3_SECRET_KEY: ${{ secrets.MASSIVE_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'

      - name: Probe quote Flat File entitlement without downloading
        shell: bash
        run: |
          mkdir -p artifacts
          python - <<'PY' | tee artifacts/quote-flatfile-probe.txt
          from datetime import date
          from pathlib import Path
          from botocore.exceptions import ClientError

          from victory_trader.config import load_flatfile_credentials
          from victory_trader.flatfiles import MassiveFlatFilesClient

          prefix = "us_stocks_sip/quotes_v1"
          day = date(2026, 3, 2)
          access, secret = load_flatfile_credentials()
          client = MassiveFlatFilesClient(access, secret)
          try:
              obj = client.head(prefix, day)
          except ClientError as exc:
              code = str(exc.response.get("Error", {}).get("Code", ""))
              print("status=UNAVAILABLE")
              print(f"error_code={code}")
          except FileNotFoundError:
              print("status=NOT_FOUND")
          else:
              print("status=AVAILABLE")
              print(f"dataset={obj.dataset}")
              print(f"day={obj.day}")
              print(f"key={obj.key}")
              print(f"size_bytes={obj.size_bytes}")
              print(f"size_gib={(obj.size_bytes or 0) / (1024**3):.3f}")
          PY

      - name: Upload quote Flat File probe
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-quote-flatfile-probe-${{ needs.request.outputs.request_id }}
          path: victory-trader/artifacts/quote-flatfile-probe.txt
