name: MoneyMaker Research Request

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/research-request.json'

permissions:
  contents: read
  actions: read

jobs:
  request:
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.read.outputs.operation }}
      request_id: ${{ steps.read.outputs.request_id }}
      start_date: ${{ steps.read.outputs.start_date }}
      end_date: ${{ steps.read.outputs.end_date }}
      chunk_days: ${{ steps.read.outputs.chunk_days }}
      max_candidates: ${{ steps.read.outputs.max_candidates }}
      annotate_halts: ${{ steps.read.outputs.annotate_halts }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("victory-trader/research/research-request.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          request_id = str(payload["request_id"])
          operation = str(payload.get("operation", "module"))
          if operation not in {"module", "research_month"}:
              raise SystemExit(f"unsupported research operation: {operation}")

          if operation == "module":
              if not payload.get("module"):
                  raise SystemExit("module operation requires 'module'")
              if not isinstance(payload.get("args", []), list):
                  raise SystemExit("'args' must be a list")
              if not isinstance(payload.get("dependencies", []), list):
                  raise SystemExit("'dependencies' must be a list")
          else:
              for key in ("start_date", "end_date", "chunk_days"):
                  if key not in payload:
                      raise SystemExit(f"research_month missing {key}")

          values = {
              "operation": operation,
              "request_id": request_id,
              "start_date": str(payload.get("start_date", "")),
              "end_date": str(payload.get("end_date", "")),
              "chunk_days": str(payload.get("chunk_days", "")),
              "max_candidates": str(payload.get("max_candidates", "")),
              "annotate_halts": (
                  "true" if bool(payload.get("annotate_halts", True)) else "false"
              ),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          print(f"Research request {request_id}: {operation}")
          PY

  research-month:
    if: ${{ needs.request.outputs.operation == 'research_month' }}
    needs: request
    uses: ./.github/workflows/victory-trader-research.yml
    with:
      start_date: ${{ needs.request.outputs.start_date }}
      end_date: ${{ needs.request.outputs.end_date }}
      chunk_days: ${{ needs.request.outputs.chunk_days }}
      max_candidates: ${{ needs.request.outputs.max_candidates }}
      annotate_halts: ${{ needs.request.outputs.annotate_halts == 'true' }}
    secrets: inherit

  module:
    if: ${{ needs.request.outputs.operation == 'module' }}
    needs: request
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      MASSIVE_S3_ACCESS_KEY: ${{ secrets.MASSIVE_S3_ACCESS_KEY }}
      MASSIVE_S3_SECRET_KEY: ${{ secrets.MASSIVE_S3_SECRET_KEY }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen research stack
        run: python -m pip install -e '.[dev]' -c research/request214-requirements.txt

      - name: Restore shared flat-file cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-generic-flatfiles-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-fresh-economic-flatfiles-${{ runner.os }}-
            moneymaker-fresh-hierarchical-flatfiles-${{ runner.os }}-
            moneymaker-request163-stage2-flatfiles-${{ runner.os }}-

      - name: Restore shared second cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-generic-second-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-fresh-economic-second-${{ runner.os }}-
            moneymaker-fresh-economic-stage2-second-${{ runner.os }}-
            moneymaker-request163-stage2-second-${{ runner.os }}-

      - name: Validate and test requested module
        shell: bash
        run: |
          set -euo pipefail
          ruff check src tests --select E4,E7,E9,F
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          payload = json.loads(
              Path("research/research-request.json").read_text(encoding="utf-8")
          )
          tests = [str(item) for item in payload.get("pytest", [])]
          if tests:
              subprocess.run(["pytest", "-q", *tests], check=True)
          PY

      - name: Download declared research dependencies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          payload = json.loads(
              Path("research/research-request.json").read_text(encoding="utf-8")
          )
          for dep in payload.get("dependencies", []):
              run_id = str(dep["run_id"])
              name = str(dep["name"])
              destination = Path(str(dep["path"]))
              destination.mkdir(parents=True, exist_ok=True)
              repo = str(dep.get("repo", "dayofhiki/MoneyMaker"))
              command = [
                  "gh", "run", "download", run_id,
                  "-n", name,
                  "-D", str(destination),
                  "-R", repo,
              ]
              print("+", " ".join(command))
              subprocess.run(command, check=True)
          PY

      - name: Execute research module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          python - <<'PY' 2>&1 | tee artifacts/research-request.log
          import json
          import subprocess
          import sys
          from pathlib import Path

          payload = json.loads(
              Path("research/research-request.json").read_text(encoding="utf-8")
          )
          command = [
              sys.executable,
              "-m",
              str(payload["module"]),
              *[str(item) for item in payload.get("args", [])],
          ]
          print("+", " ".join(command), flush=True)
          raise SystemExit(subprocess.run(command).returncode)
          PY

      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-research-request-${{ needs.request.outputs.request_id }}
          path: |
            victory-trader/artifacts/**
          if-no-files-found: warn
          retention-days: 90
