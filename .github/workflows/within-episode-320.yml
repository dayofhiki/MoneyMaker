name: MoneyMaker R320 Independent Cached Replay

on:
  push:
    branches: [research/within-episode-ranking-320]
    paths: ['.github/workflows/within-episode-320.yml']

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: victory-trader
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Critical checks and causal regressions
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_within_episode_momentum.py tests/test_state_evolution_momentum.py tests/test_context_interaction_momentum.py tests/test_continuous_population_momentum.py tests/test_compact_momentum_representation.py tests/test_clock_momentum_increment.py
      - uses: actions/download-artifact@v4
        with:
          name: moneymaker-independent-request-319
          path: victory-trader/prepared/official319
          run-id: 37588633963
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: One fixed offline experiment
        run: |
          set -o pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          python -m victory_trader.within_episode_momentum \
            --previous prepared/official319 --pinned-inputs research/request320-inputs.json \
            --output-dir artifacts | tee artifacts/request320.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneymaker-independent-request-320
          path: victory-trader/artifacts/
          if-no-files-found: warn
          retention-days: 90
