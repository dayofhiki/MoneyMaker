name: Victory Trader Research

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: true
        default: '2026-09-01'
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: true
        default: '2026-09-05'
      max_candidates:
        description: 'DEBUG ONLY: deterministic candidates/day (blank = unbiased full universe)'
        required: false
        default: ''
      request_interval:
        description: 'Seconds between uncached Massive API requests'
        required: true
        default: '12.5'
      annotate_halts:
        description: 'Try to attach Nasdaq halt annotations'
        required: true
        type: boolean
        default: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Massive research cache
        uses: actions/cache@v4
        with:
          path: victory-trader/data/cache/massive
          key: victory-trader-massive-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            victory-trader-massive-${{ runner.os }}-

      - name: Validate API secret
        shell: bash
        run: |
          if [ -z "$MASSIVE_API_KEY" ]; then
            echo "MASSIVE_API_KEY repository secret is not configured."
            exit 1
          fi

      - name: Install Victory Trader
        run: python -m pip install -e '.[dev]'

      - name: Run tests first
        run: pytest -q

      - name: Build research dataset
        shell: bash
        run: |
          mkdir -p data/events artifacts data/cache/massive
          ARGS=(
            "${{ inputs.start_date }}"
            "${{ inputs.end_date }}"
            --output data/events/research.parquet
            --request-interval "${{ inputs.request_interval }}"
          )
          if [ -n "${{ inputs.max_candidates }}" ]; then
            echo "WARNING: max_candidates is DEBUG ONLY and this run is not a full-universe research sample." | tee artifacts/sample-warning.txt
            ARGS+=(--max-candidates "${{ inputs.max_candidates }}")
          fi
          if [ "${{ inputs.annotate_halts }}" = "true" ]; then
            ARGS+=(--annotate-halts)
          fi
          victory-trader multi-day-dataset "${ARGS[@]}" | tee artifacts/build.log

      - name: Audit dataset integrity
        shell: bash
        run: |
          AUDIT_ARGS=(data/events/research.parquet)
          if [ -n "${{ inputs.max_candidates }}" ]; then
            AUDIT_ARGS+=(--allow-debug-sample)
          fi
          victory-trader audit-dataset "${AUDIT_ARGS[@]}" | tee artifacts/audit.txt

      - name: Analyze dataset
        shell: bash
        run: |
          victory-trader analyze-dataset data/events/research.parquet --horizon 5 \
            | tee artifacts/analysis.txt

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: victory-trader-${{ inputs.start_date }}-${{ inputs.end_date }}
          path: |
            victory-trader/data/events/research.parquet
            victory-trader/artifacts/build.log
            victory-trader/artifacts/audit.txt
            victory-trader/artifacts/analysis.txt
            victory-trader/artifacts/sample-warning.txt
          if-no-files-found: ignore
          retention-days: 30
