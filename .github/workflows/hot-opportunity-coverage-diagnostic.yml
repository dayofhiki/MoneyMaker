name: MoneyMaker HOT Opportunity Coverage Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/hot-opportunity-coverage-request.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'

      - name: Test coverage diagnostic
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_hot_opportunity_coverage_diagnostic.py

      - name: Download request 140B artifact
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-hot-economic-opportunity-v11-140
          path: victory-trader/artifacts/request140b
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: dayofhiki/MoneyMaker
          run-id: 35829190438

      - name: Diagnose request 140B label coverage
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.hot_opportunity_coverage_diagnostic \
            --input artifacts/request140b/hot-economic-opportunity-v11.parquet \
            --summary artifacts/hot-opportunity-coverage-v10.json \
            | tee artifacts/hot-opportunity-coverage-v10.log

      - name: Upload coverage diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-hot-opportunity-coverage-v10-143
          path: |
            victory-trader/artifacts/hot-opportunity-coverage-v10.json
            victory-trader/artifacts/hot-opportunity-coverage-v10.log
          if-no-files-found: error
          retention-days: 90
