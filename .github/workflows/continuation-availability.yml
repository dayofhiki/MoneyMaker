name: MoneyMaker Continuation Availability

on:
  push:
    branches:
      - research/continuation-availability-240
    paths:
      - 'victory-trader/research/continuation-availability-request.json'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical stack
        run: python -m pip install -e '.[dev]' -c research/request214-requirements.txt
      - name: Check request240 availability contract
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_continuation_availability.py
      - name: Download frozen Request233 rows
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-economic-full-hot-admission-233
          path: victory-trader/prepared/request233
          repository: dayofhiki/MoneyMaker
          run-id: 36251239308
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate request240
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.continuation_availability \
            --scored-hot prepared/request233/request233-full-hot-states.parquet \
            --output artifacts/request240.json \
            --rows-output artifacts/request240-full-hot-states.parquet \
            | tee artifacts/request240.log
      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-continuation-availability-240
          path: |
            victory-trader/artifacts/request240.json
            victory-trader/artifacts/request240-full-hot-states.parquet
            victory-trader/artifacts/request240.log
          if-no-files-found: error
          retention-days: 90
