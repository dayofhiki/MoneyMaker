name: MoneyMaker One Event Redecision

on:
  push:
    branches:
      - research/one-event-redecision-247
    paths:
      - 'victory-trader/research/one-event-redecision-request.json'
      - 'victory-trader/src/victory_trader/one_event_redecision.py'
      - 'victory-trader/tests/test_one_event_redecision.py'
      - '.github/workflows/one-event-redecision.yml'
  pull_request:
    paths:
      - 'victory-trader/research/one-event-redecision-request.json'
      - 'victory-trader/src/victory_trader/one_event_redecision.py'
      - 'victory-trader/tests/test_one_event_redecision.py'
      - '.github/workflows/one-event-redecision.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: victory-trader
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical stack
        run: python -m pip install -e '.[dev]' -c research/request214-requirements.txt
      - name: Check Request247 contracts
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_one_event_redecision.py tests/test_direct_action_advantage.py tests/test_chronological_action_value.py
      - name: Download Request171 rich-second fit/calibration
        uses: actions/download-artifact@v4
        with:
          pattern: request171-rich-second-*
          path: victory-trader/prepared/rich
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36033120106
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate Request247
        run: |
          set -o pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          python -m victory_trader.one_event_redecision \
            --fit-positions prepared/rich/fit-rich-second.parquet \
            --calibration-positions prepared/rich/calibration-rich-second.parquet \
            --output artifacts/request247.json \
            --rows-output artifacts/request247-rows.parquet \
            | tee artifacts/request247.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneymaker-one-event-redecision-247
          path: |
            victory-trader/artifacts/request247.json
            victory-trader/artifacts/request247-rows.parquet
            victory-trader/artifacts/request247.log
            victory-trader/artifacts/source-sha.txt
          if-no-files-found: warn
          retention-days: 90
