name: MoneyMaker Future Cost Cover State Observability

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/future-cost-cover-state-observability-request.json'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Test request 191
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_future_cost_cover_state_observability.py

      - name: Download Request 171 fit/calibration POSITION phases
        uses: actions/download-artifact@v4
        with:
          pattern: request171-rich-second-*
          path: victory-trader/prepared/rich
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36033120106
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Request 178 fresh POSITION and scan shards
        uses: actions/download-artifact@v4
        with:
          pattern: request178-fresh-*
          path: victory-trader/prepared/fresh
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36038233507
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Request 163 historical opportunity scan
        uses: actions/download-artifact@v4
        with:
          name: request163-opportunity-prepared
          path: victory-trader/prepared/opportunity
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate request 191
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.future_cost_cover_state_observability \
            --fit prepared/rich/fit-rich-second.parquet \
            --calibration prepared/rich/calibration-rich-second.parquet \
            --history-scan prepared/opportunity/opportunity-scan.parquet \
            --fresh-dir prepared/fresh \
            --output artifacts/future-cost-cover-state-observability-v10.json \
            --scored-output artifacts/future-cost-cover-state-observability-v10.parquet \
            | tee artifacts/future-cost-cover-state-observability-v10.log

      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-future-cost-cover-state-observability-v10-191
          path: |
            victory-trader/artifacts/future-cost-cover-state-observability-v10.json
            victory-trader/artifacts/future-cost-cover-state-observability-v10.parquet
            victory-trader/artifacts/future-cost-cover-state-observability-v10.log
          if-no-files-found: error
          retention-days: 90
