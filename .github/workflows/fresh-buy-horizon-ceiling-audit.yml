name: MoneyMaker Fresh BUY Horizon Ceiling Audit

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/fresh-buy-horizon-ceiling-audit-request.json'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Test request 187
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_fresh_buy_horizon_ceiling_audit.py

      - name: Download Request 178 fresh POSITION shards
        uses: actions/download-artifact@v4
        with:
          pattern: request178-fresh-*
          path: victory-trader/prepared/fresh
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36038233507
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit request 187
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.fresh_buy_horizon_ceiling_audit             --fresh-dir prepared/fresh             --output artifacts/fresh-buy-horizon-ceiling-audit-v10.json             --rows-output artifacts/fresh-buy-horizon-ceiling-audit-v10.parquet             | tee artifacts/fresh-buy-horizon-ceiling-audit-v10.log

      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-fresh-buy-horizon-ceiling-audit-v10-187
          path: |
            victory-trader/artifacts/fresh-buy-horizon-ceiling-audit-v10.json
            victory-trader/artifacts/fresh-buy-horizon-ceiling-audit-v10.parquet
            victory-trader/artifacts/fresh-buy-horizon-ceiling-audit-v10.log
          if-no-files-found: error
          retention-days: 90
