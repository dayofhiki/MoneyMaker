name: MoneyMaker Event Time Full HOT Tradability

on:
  push:
    branches:
      - research/event-time-full-hot-tradability-232
    paths:
      - 'victory-trader/research/event-time-full-hot-tradability-request.json'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: victory-trader
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical stack
        run: python -m pip install -e '.[dev]' -c research/request214-requirements.txt
      - name: Check code and event-time full-HOT tradability contract
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_event_time_full_hot_tradability.py tests/test_extended_history_economic_opportunity.py tests/test_hot_economic_opportunity.py
      - name: Download Request 163 stage2 population
        uses: actions/download-artifact@v4
        with:
          name: request163-stage2-prepared
          path: victory-trader/prepared/stage2
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Request 163 opportunity population
        uses: actions/download-artifact@v4
        with:
          name: request163-opportunity-prepared
          path: victory-trader/prepared/opportunity
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate request 232
        run: |
          set -o pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          python -m victory_trader.event_time_full_hot_tradability \
            --stage2-candidates prepared/stage2/stage2-candidates.parquet \
            --opportunity-candidates prepared/opportunity/opportunity-candidates.parquet \
            --opportunity-scan prepared/opportunity/opportunity-scan.parquet \
            --output artifacts/request232.json \
            --rows-output artifacts/request232-full-hot-states.parquet \
            | tee artifacts/request232.log
      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-event-time-full-hot-tradability-232
          path: |
            victory-trader/artifacts/request231.json
            victory-trader/artifacts/request231-full-hot-states.parquet
            victory-trader/artifacts/request231.log
            victory-trader/artifacts/source-sha.txt
          if-no-files-found: error
          retention-days: 90
