name: MoneyMaker Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'victory-trader/**'
      - '.github/workflows/victory-trader-tests.yml'
      - '.github/workflows/victory-trader-research.yml'
  pull_request:
    paths:
      - 'victory-trader/**'
      - '.github/workflows/victory-trader-tests.yml'
      - '.github/workflows/victory-trader-research.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: victory-trader

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Ruff critical checks
        run: ruff check src tests --select E4,E7,E9,F
      - name: Test
        run: pytest -q
