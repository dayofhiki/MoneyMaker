name: Victory Trader Tests

on:
  push:
    paths:
      - 'victory-trader/**'
      - '.github/workflows/victory-trader-tests.yml'
  pull_request:
    paths:
      - 'victory-trader/**'
      - '.github/workflows/victory-trader-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: victory-trader

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q
