name: MoneyMaker Conditional Candidate Value

on:
  push:
    branches:
      - research/conditional-candidate-value-281
    paths:
      - 'victory-trader/research/conditional-candidate-value-request.json'
      - 'victory-trader/src/victory_trader/conditional_candidate_value.py'
      - 'victory-trader/tests/test_conditional_candidate_value.py'
      - '.github/workflows/conditional-candidate-value.yml'
  pull_request:
    paths:
      - 'victory-trader/research/conditional-candidate-value-request.json'
      - 'victory-trader/src/victory_trader/conditional_candidate_value.py'
      - 'victory-trader/tests/test_conditional_candidate_value.py'
      - '.github/workflows/conditional-candidate-value.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical stack
        run: python -m pip install -e '.[dev]' -c research/request214-requirements.txt
      - name: Check Request281 contracts
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_conditional_candidate_value.py tests/test_prehot_context_ablation.py
      - name: Download frozen Request233 full-HOT population
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-economic-full-hot-admission-233
          path: victory-trader/prepared/request233
          repository: dayofhiki/MoneyMaker
          run-id: 36251239308
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Request163 opportunity population
        uses: actions/download-artifact@v4
        with:
          name: request163-opportunity-prepared
          path: victory-trader/prepared/opportunity
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate Request281
        run: |
          set -o pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          python -m victory_trader.conditional_candidate_value \
            --first-hot prepared/request233/request233-full-hot-states.parquet \
            --opportunity-scan prepared/opportunity/opportunity-scan.parquet \
            --output artifacts/request281.json \
            --rows-output artifacts/request281-rows.parquet \
            | tee artifacts/request281.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneymaker-conditional-candidate-value-281
          path: |
            victory-trader/artifacts/request281.json
            victory-trader/artifacts/request281.log
            victory-trader/artifacts/request281-rows.parquet
            victory-trader/artifacts/source-sha.txt
          if-no-files-found: warn
          retention-days: 90
