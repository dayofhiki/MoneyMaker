name: MoneyMaker Candidate Score v1

on:
  push:
    branches: [main]
    paths:
      - 'victory-trader/src/victory_trader/candidate_score.py'
      - 'victory-trader/tests/test_candidate_score.py'
      - '.github/workflows/candidate-score-v1.yml'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Completed enrichment run ID'
        required: true
        default: '35284485307'
      source_artifact:
        description: 'Enriched artifact name'
        required: true
        default: 'moneymaker-enriched-2026-03-v05'
      output_label:
        description: 'Candidate artifact label'
        required: true
        default: '2026-03-v1'

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: victory-trader
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id || '35284485307' }}
      SOURCE_ARTIFACT: ${{ inputs.source_artifact || 'moneymaker-enriched-2026-03-v05' }}
      OUTPUT_LABEL: ${{ inputs.output_label || '2026-03-v1' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'

      - name: Ruff critical checks
        run: ruff check src tests --select E4,E7,E9,F

      - name: Test
        run: pytest -q

      - name: Download enriched March research artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: victory-trader/source-artifact
          github-token: ${{ github.token }}
          repository: dayofhiki/MoneyMaker
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Fit locked candidate score and test March holdout
        shell: bash
        run: |
          mkdir -p artifacts
          FILE="$(find source-artifact -name research-enriched.parquet -print -quit)"
          test -n "$FILE" || { echo "research-enriched.parquet not found"; exit 1; }
          python -m victory_trader.candidate_score "$FILE" \
            --report artifacts/candidate-score-v1.txt \
            --rule-json artifacts/candidate-rule-v1.json \
            --evaluation-csv artifacts/candidate-score-v1-evaluation.csv \
            | tee artifacts/candidate-score-v1.log

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-candidate-${{ env.OUTPUT_LABEL }}
          path: |
            victory-trader/artifacts/candidate-score-v1.txt
            victory-trader/artifacts/candidate-score-v1.log
            victory-trader/artifacts/candidate-rule-v1.json
            victory-trader/artifacts/candidate-score-v1-evaluation.csv
          if-no-files-found: error
          retention-days: 90
