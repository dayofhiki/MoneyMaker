name: MoneyMaker Direct Active Admission

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/direct-active-admission-request.json'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      MASSIVE_S3_ACCESS_KEY: ${{ secrets.MASSIVE_S3_ACCESS_KEY }}
      MASSIVE_S3_SECRET_KEY: ${{ secrets.MASSIVE_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'

      - name: Test request 153
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q \
            tests/test_direct_active_admission.py \
            tests/test_balanced_retention_active_allocator.py \
            tests/test_observation_transport.py \
            tests/test_actionable_active_handoff.py \
            tests/test_market_wide_focus_hazard.py

      - name: Restore market-wide Flat File cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-direct-admission-flatfiles-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-capacity-frontier-flatfiles-${{ runner.os }}-
            moneymaker-fresh-capacity-flatfiles-${{ runner.os }}-
            moneymaker-balanced-retention-flatfiles-${{ runner.os }}-

      - name: Run request 153
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.direct_active_admission \
            2026-01-02 2026-05-28 \
            --summary artifacts/direct-active-admission-v10.json \
            | tee artifacts/direct-active-admission-v10.log

      - name: Upload request 153 artifact
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-direct-active-admission-v10-153
          path: |
            victory-trader/artifacts/direct-active-admission-v10.json
            victory-trader/artifacts/direct-active-admission-v10.log
          if-no-files-found: error
          retention-days: 90

      - name: Save market-wide Flat File cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-direct-admission-flatfiles-${{ runner.os }}-${{ github.run_id }}
