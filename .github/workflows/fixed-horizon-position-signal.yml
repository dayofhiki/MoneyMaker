name: MoneyMaker Fixed Horizon Position Signal

on:
  push:
    branches:
      - research/fixed-horizon-position-signal-248
    paths:
      - 'victory-trader/research/fixed-horizon-position-signal-request.json'
      - 'victory-trader/src/victory_trader/fixed_horizon_position_signal.py'
      - 'victory-trader/tests/test_fixed_horizon_position_signal.py'
      - '.github/workflows/fixed-horizon-position-signal.yml'
  pull_request:
    paths:
      - 'victory-trader/research/fixed-horizon-position-signal-request.json'
      - 'victory-trader/src/victory_trader/fixed_horizon_position_signal.py'
      - 'victory-trader/tests/test_fixed_horizon_position_signal.py'
      - '.github/workflows/fixed-horizon-position-signal.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: victory-trader
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical stack
        run: python -m pip install -e '.[dev]' -c research/request214-requirements.txt
      - name: Check Request248 contracts
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_fixed_horizon_position_signal.py tests/test_one_step_position_value.py tests/test_causal_tradability_admission.py
      - name: Download Request171 rich-second fit/calibration
        uses: actions/download-artifact@v4
        with:
          pattern: request171-rich-second-*
          path: victory-trader/prepared/rich
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36033120106
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate Request248
        run: |
          set -o pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          python -m victory_trader.fixed_horizon_position_signal \
            --fit-positions prepared/rich/fit-rich-second.parquet \
            --calibration-positions prepared/rich/calibration-rich-second.parquet \
            --output artifacts/request248.json \
            | tee artifacts/request248.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneymaker-fixed-horizon-position-signal-248
          path: |
            victory-trader/artifacts/request248.json
            victory-trader/artifacts/request248.log
            victory-trader/artifacts/source-sha.txt
          if-no-files-found: warn
          retention-days: 90
