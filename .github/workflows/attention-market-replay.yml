name: MoneyMaker Attention Market Replay

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/attention-replay-request.json'
  workflow_dispatch:
    inputs:
      start_date:
        description: First development date (YYYY-MM-DD)
        required: true
        default: '2026-01-02'
      end_date:
        description: Last development date (YYYY-MM-DD)
        required: true
        default: '2026-01-02'
      request_id:
        description: Artifact request identifier
        required: true
        default: 'manual'

permissions:
  contents: read
  actions: read

jobs:
  request:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.read.outputs.enabled }}
      start_date: ${{ steps.read.outputs.start_date }}
      end_date: ${{ steps.read.outputs.end_date }}
      request_id: ${{ steps.read.outputs.request_id }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_START: ${{ inputs.start_date }}
          INPUT_END: ${{ inputs.end_date }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              enabled = True
              start = os.environ["INPUT_START"]
              end = os.environ["INPUT_END"]
              request_id = os.environ["INPUT_REQUEST_ID"]
          else:
              payload = json.loads(
                  Path("victory-trader/research/attention-replay-request.json").read_text(
                      encoding="utf-8"
                  )
              )
              enabled = payload.get("operation") == "attention_market_replay_v01"
              start = str(payload.get("start_date", ""))
              end = str(payload.get("end_date", ""))
              request_id = str(payload.get("request_id", ""))
          if enabled and (not start or not end or not request_id):
              raise SystemExit("attention replay request is incomplete")
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"enabled={'true' if enabled else 'false'}\n")
              handle.write(f"start_date={start}\n")
              handle.write(f"end_date={end}\n")
              handle.write(f"request_id={request_id}\n")
          PY

  replay:
    if: ${{ needs.request.outputs.enabled == 'true' }}
    needs: request
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      MASSIVE_S3_ACCESS_KEY: ${{ secrets.MASSIVE_S3_ACCESS_KEY }}
      MASSIVE_S3_SECRET_KEY: ${{ secrets.MASSIVE_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'

      - name: Test attention replay layers
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_attention_runtime.py tests/test_attention_replay.py tests/test_attention_flatfile_replay.py tests/test_attention_artifact_compaction.py

      - name: Restore reusable Flat File cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-attention-v01-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-attention-v01-${{ runner.os }}-
            moneymaker-state-v01-${{ runner.os }}-

      - name: Replay frozen market-wide attention slice
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.attention_partitioned_replay \
            "${{ needs.request.outputs.start_date }}" \
            "${{ needs.request.outputs.end_date }}" \
            --scan-dir artifacts/attention-market-scan-v01 \
            --trace-dir artifacts/attention-market-trace-v01 \
            --summary artifacts/attention-market-summary-v01.json \
            | tee artifacts/attention-market-replay-v01.log
          find artifacts/attention-market-scan-v01 -name '*.parquet' -print -quit | grep -q .
          find artifacts/attention-market-trace-v01 -name '*.parquet' -print -quit | grep -q .
          test -s artifacts/attention-market-summary-v01.json
          python -m victory_trader.attention_artifact_compaction \
            --scan-dir artifacts/attention-market-scan-v01 \
            --trace-dir artifacts/attention-market-trace-v01 \
            --focus-output artifacts/attention-market-focus-v01.parquet \
            --runner-output artifacts/attention-market-runners-v01.parquet
          test -s artifacts/attention-market-focus-v01.parquet
          test -s artifacts/attention-market-runners-v01.parquet

      - name: Save reusable Flat File cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-attention-v01-${{ runner.os }}-${{ github.run_id }}

      - name: Upload attention replay audit
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-attention-market-replay-v01-${{ needs.request.outputs.request_id }}
          path: |
            victory-trader/artifacts/attention-market-focus-v01.parquet
            victory-trader/artifacts/attention-market-runners-v01.parquet
            victory-trader/artifacts/attention-market-summary-v01.json
            victory-trader/artifacts/attention-market-replay-v01.log
          if-no-files-found: error
          retention-days: 90
