name: MoneyMaker Rich Second POSITION Value

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/rich-second-position-value-request.json'

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Test request 171
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_rich_second_position_value.py

  enrich:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        phase: [fit, calibration, evaluation]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Restore Request 166 second cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-request171-second-${{ matrix.phase }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-request166-second-${{ matrix.phase }}-
            moneymaker-request165-second-
            moneymaker-request163-opportunity-second-
      - name: Download Request 166 position phase
        uses: actions/download-artifact@v4
        with:
          name: request166-position-${{ matrix.phase }}
          path: victory-trader/prepared/position
          repository: dayofhiki/MoneyMaker
          run-id: 36027818439
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enrich rich second state
        run: |
          mkdir -p prepared/enriched
          python -m victory_trader.rich_second_position_value \
            enrich \
            --input prepared/position/${{ matrix.phase }}-paths.parquet \
            --output prepared/enriched/${{ matrix.phase }}-rich-second.parquet \
            --audit prepared/enriched/${{ matrix.phase }}-rich-second-audit.json
      - name: Save Request 171 second cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-request171-second-${{ matrix.phase }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: request171-rich-second-${{ matrix.phase }}
          path: victory-trader/prepared/enriched/
          if-no-files-found: error
          retention-days: 14

  evaluate:
    needs: enrich
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Download rich second phases
        uses: actions/download-artifact@v4
        with:
          pattern: request171-rich-second-*
          path: victory-trader/prepared/rich
          merge-multiple: true
      - name: Evaluate request 171
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.rich_second_position_value \
            evaluate \
            --fit prepared/rich/fit-rich-second.parquet \
            --calibration prepared/rich/calibration-rich-second.parquet \
            --evaluation prepared/rich/evaluation-rich-second.parquet \
            --evaluation-audit prepared/rich/evaluation-rich-second-audit.json \
            --output artifacts/rich-second-position-value-v10.json \
            --scored-output artifacts/rich-second-position-value-v10.parquet \
            | tee artifacts/rich-second-position-value-v10.log
      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-rich-second-position-value-v10-171
          path: |
            victory-trader/artifacts/rich-second-position-value-v10.json
            victory-trader/artifacts/rich-second-position-value-v10.parquet
            victory-trader/artifacts/rich-second-position-value-v10.log
          if-no-files-found: error
          retention-days: 90
