name: MoneyMaker Rich Second Quantile Patience

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/rich-second-quantile-patience-request.json'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Test request 172
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_rich_second_quantile_patience.py
      - name: Download Request 171 enriched phases
        uses: actions/download-artifact@v4
        with:
          pattern: request171-rich-second-*
          path: victory-trader/prepared/rich
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36033120106
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate request 172
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.rich_second_quantile_patience \
            --fit prepared/rich/fit-rich-second.parquet \
            --calibration prepared/rich/calibration-rich-second.parquet \
            --evaluation prepared/rich/evaluation-rich-second.parquet \
            --output artifacts/rich-second-quantile-patience-v10.json \
            --scored-output artifacts/rich-second-quantile-patience-v10.parquet \
            | tee artifacts/rich-second-quantile-patience-v10.log
      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-rich-second-quantile-patience-v10-172
          path: |
            victory-trader/artifacts/rich-second-quantile-patience-v10.json
            victory-trader/artifacts/rich-second-quantile-patience-v10.parquet
            victory-trader/artifacts/rich-second-quantile-patience-v10.log
          if-no-files-found: error
          retention-days: 90
