name: MoneyMaker Entry Opportunity Ceiling

on:
  push:
    branches:
      - research/entry-opportunity-ceiling-242
    paths:
      - 'victory-trader/research/entry-opportunity-ceiling-request.json'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: victory-trader
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical stack
        run: python -m pip install -e '.[dev]' -c research/request214-requirements.txt
      - name: Check request242 diagnostic
        run: ruff check src tests --select E4,E7,E9,F
      - name: Download Request171 rich-second fit/calibration
        uses: actions/download-artifact@v4
        with:
          pattern: request171-rich-second-*
          path: victory-trader/prepared/rich
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36033120106
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Request178 development shards
        uses: actions/download-artifact@v4
        with:
          pattern: request178-fresh-*
          path: victory-trader/prepared/fresh
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36038233507
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate request242
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.entry_opportunity_ceiling \
            --fit-positions prepared/rich/fit-rich-second.parquet \
            --calibration-positions prepared/rich/calibration-rich-second.parquet \
            --fresh-dir prepared/fresh \
            --output artifacts/request242.json \
            | tee artifacts/request242.log
      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-entry-opportunity-ceiling-242
          path: |
            victory-trader/artifacts/request242.json
            victory-trader/artifacts/request242.log
          if-no-files-found: error
          retention-days: 90
