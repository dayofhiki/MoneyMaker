name: MoneyMaker Multi-Horizon Discovery

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Completed enrichment run ID'
        required: true
        default: '35284485307'
      source_artifact:
        description: 'Enriched artifact name from that run'
        required: true
        default: 'moneymaker-enriched-2026-03-v05'
      output_label:
        description: 'Label for multi-horizon artifact'
        required: true
        default: '2026-03-v05'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: victory-trader

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'

      - name: Ruff critical checks
        run: ruff check src tests --select E4,E7,E9,F

      - name: Test
        run: pytest -q

      - name: Download enriched research artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact }}
          path: victory-trader/source-artifact
          github-token: ${{ github.token }}
          repository: dayofhiki/MoneyMaker
          run-id: ${{ inputs.source_run_id }}

      - name: Run pre-specified multi-horizon discovery
        shell: bash
        run: |
          mkdir -p artifacts
          FILE="$(find source-artifact -name research-enriched.parquet -print -quit)"
          test -n "$FILE" || { echo "research-enriched.parquet not found"; exit 1; }
          python -m victory_trader.multi_horizon_discovery "$FILE" \
            --output artifacts/multi-horizon-discovery.txt \
            --details-csv artifacts/multi-horizon-details.csv \
            --stability-csv artifacts/multi-horizon-stability.csv \
            | tee artifacts/multi-horizon-discovery.log

      - name: Upload multi-horizon artifact
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-multihorizon-${{ inputs.output_label }}
          path: |
            victory-trader/artifacts/multi-horizon-discovery.txt
            victory-trader/artifacts/multi-horizon-discovery.log
            victory-trader/artifacts/multi-horizon-details.csv
            victory-trader/artifacts/multi-horizon-stability.csv
          if-no-files-found: error
          retention-days: 90
