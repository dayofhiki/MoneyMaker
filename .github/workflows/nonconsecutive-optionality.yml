name: MoneyMaker Nonconsecutive Optionality

on:
  push:
    branches:
      - research/nonconsecutive-optionality-239
    paths:
      - 'victory-trader/research/nonconsecutive-optionality-request.json'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: victory-trader
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical stack
        run: python -m pip install -e '.[dev]' -c research/request214-requirements.txt
      - name: Check request239 target contract
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_nonconsecutive_optionality.py
      - name: Download frozen Request233 rows
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-economic-full-hot-admission-233
          path: victory-trader/prepared/request233
          repository: dayofhiki/MoneyMaker
          run-id: 36251239308
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate request239
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.nonconsecutive_optionality \
            --scored-hot prepared/request233/request233-full-hot-states.parquet \
            --output artifacts/request239.json \
            --rows-output artifacts/request239-full-hot-states.parquet \
            | tee artifacts/request239.log
      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-nonconsecutive-optionality-239
          path: |
            victory-trader/artifacts/request239.json
            victory-trader/artifacts/request239-full-hot-states.parquet
            victory-trader/artifacts/request239.log
          if-no-files-found: error
          retention-days: 90
