name: MoneyMaker R330 Independent Cached Replay

on: [push]

permissions:
  contents: read
  actions: read

jobs:
  replay:
    if: github.ref == 'refs/heads/research/current-state-enter-wait-330'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: victory-trader
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' numpy==2.4.6 pandas==3.0.6 scipy==1.17.1 scikit-learn==1.9.1 pyarrow==25.0.1 pytest==9.1.1 ruff==0.16.10
      - name: Critical checks and causal action regressions
        run: |
          ruff check src tests research/verify_request330.py --select E4,E7,E9,F
          pytest -q tests/test_current_state_action_policy.py tests/test_accumulated_current_evidence_momentum.py tests/test_gated_trajectory_residual_momentum.py
      - uses: actions/download-artifact@v4
        with:
          name: moneymaker-research-request-311
          path: victory-trader/prepared/official311
          run-id: 37223064559
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: moneymaker-research-request-315
          path: victory-trader/prepared/official315
          run-id: 37450538746
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: moneymaker-independent-request-319
          path: victory-trader/prepared/official319
          run-id: 37588633963
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: moneymaker-independent-request-321
          path: victory-trader/prepared/official321
          run-id: 37594980002
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: moneymaker-independent-request-328
          path: victory-trader/prepared/official328
          run-id: 37657314310
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: moneymaker-independent-request-328-feature-history
          path: victory-trader/prepared/official328-secondary
          run-id: 37657314310
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge authenticated fixed current-state controls
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          for source in Path('prepared/official328-secondary').iterdir():
              target = Path('prepared/official328')/source.name
              if target.exists():
                  assert target.read_bytes() == source.read_bytes(), source.name
              else:
                  shutil.copyfile(source, target)
          PY
      - name: One fixed offline action-policy experiment
        run: |
          set -o pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          python --version > artifacts/environment.txt
          python -m pip freeze >> artifacts/environment.txt
          python -m victory_trader.current_state_action_policy \
            --previous prepared --pinned-inputs research/request330-inputs.json \
            --output-dir artifacts 2>&1 | tee artifacts/request330.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneymaker-independent-request-330
          path: victory-trader/artifacts/
          if-no-files-found: warn
          retention-days: 90

