name: MoneyMaker Research Analysis

on:
  workflow_run:
    workflows:
      - MoneyMaker Research
      - MoneyMaker Research Request
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    outputs:
      has_research_artifact: ${{ steps.check.outputs.has_research_artifact }}
    steps:
      - id: check
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.payload.workflow_run.id,
                per_page: 100,
              }
            );
            const finalResearch = artifacts.find(a =>
              /^moneymaker-\d{4}-\d{2}-\d{2}-\d{4}-\d{2}-\d{2}$/.test(a.name)
            );
            core.setOutput("has_research_artifact", finalResearch ? "true" : "false");
            core.info(
              finalResearch
                ? `Found final research artifact: ${finalResearch.name}`
                : "No final research artifact; skipping Research Analysis."
            );

  discover:
    needs: probe
    if: ${{ github.event.workflow_run.conclusion == 'success' && needs.probe.outputs.has_research_artifact == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_S3_ACCESS_KEY: ${{ secrets.MASSIVE_S3_ACCESS_KEY }}
      MASSIVE_S3_SECRET_KEY: ${{ secrets.MASSIVE_S3_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MoneyMaker
        run: python -m pip install -e .

      - name: Validate Flat Files credentials
        shell: bash
        run: |
          test -n "$MASSIVE_S3_ACCESS_KEY" || { echo "MASSIVE_S3_ACCESS_KEY is missing"; exit 1; }
          test -n "$MASSIVE_S3_SECRET_KEY" || { echo "MASSIVE_S3_SECRET_KEY is missing"; exit 1; }

      - name: Restore reusable discovery Flat File cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-discovery-v05-${{ runner.os }}-${{ github.event.workflow_run.id }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-discovery-v05-${{ runner.os }}-

      - name: Download final research artifact
        uses: actions/download-artifact@v4
        with:
          pattern: moneymaker-20*
          path: victory-trader/source-artifact
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Enrich point-in-time discovery features
        shell: bash
        run: |
          mkdir -p artifacts data/events
          FILE="$(find source-artifact -name research.parquet -print -quit)"
          test -n "$FILE" || { echo "research.parquet not found"; exit 1; }
          python -m victory_trader.path_enrichment "$FILE" \
            --output data/events/research-enriched.parquet \
            | tee artifacts/enrichment.log

      - name: Audit enriched dataset
        run: moneymaker audit-dataset data/events/research-enriched.parquet | tee artifacts/audit-enriched.txt

      - name: Run gross-versus-net edge discovery
        shell: bash
        run: |
          python -m victory_trader.extended_edge_discovery \
            data/events/research-enriched.parquet \
            --horizon 5 \
            --output artifacts/extended-edge-discovery.txt \
            | tee artifacts/extended-edge-discovery.log

      - name: Run pre-specified multi-horizon discovery
        shell: bash
        run: |
          python -m victory_trader.multi_horizon_discovery \
            data/events/research-enriched.parquet \
            --output artifacts/multi-horizon-discovery.txt \
            --details-csv artifacts/multi-horizon-details.csv \
            --stability-csv artifacts/multi-horizon-stability.csv \
            | tee artifacts/multi-horizon-discovery.log

      - name: Download locked March candidate v1 rule
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-candidate-2026-03-v1
          path: victory-trader/rule-artifact
          github-token: ${{ github.token }}
          repository: dayofhiki/MoneyMaker
          run-id: '35288983942'

      - name: Apply frozen candidate v1 without refitting
        shell: bash
        run: |
          RULE="$(find rule-artifact -name candidate-rule-v1.json -print -quit)"
          test -n "$RULE" || { echo "candidate-rule-v1.json not found"; exit 1; }
          python -m victory_trader.candidate_validation \
            data/events/research-enriched.parquet \
            --rule-json "$RULE" \
            --report artifacts/candidate-v1-external-validation.txt \
            --evaluation-csv artifacts/candidate-v1-external-evaluation.csv \
            --thresholds-csv artifacts/candidate-v1-external-thresholds.csv \
            | tee artifacts/candidate-v1-external-validation.log

      - name: Save reusable discovery Flat File cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-discovery-v05-${{ runner.os }}-${{ github.event.workflow_run.id }}-${{ github.run_id }}

      - name: Upload enriched discovery artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-research-analysis-${{ github.event.workflow_run.id }}
          path: |
            victory-trader/data/events/research-enriched.parquet
            victory-trader/artifacts/enrichment.log
            victory-trader/artifacts/audit-enriched.txt
            victory-trader/artifacts/extended-edge-discovery.txt
            victory-trader/artifacts/extended-edge-discovery.log
            victory-trader/artifacts/multi-horizon-discovery.txt
            victory-trader/artifacts/multi-horizon-discovery.log
            victory-trader/artifacts/multi-horizon-details.csv
            victory-trader/artifacts/multi-horizon-stability.csv
            victory-trader/artifacts/candidate-v1-external-validation.txt
            victory-trader/artifacts/candidate-v1-external-validation.log
            victory-trader/artifacts/candidate-v1-external-evaluation.csv
            victory-trader/artifacts/candidate-v1-external-thresholds.csv
          if-no-files-found: warn
          retention-days: 90
