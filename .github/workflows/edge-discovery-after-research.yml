name: MoneyMaker Edge Discovery

on:
  workflow_run:
    workflows:
      - MoneyMaker Research
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  discover:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MoneyMaker
        run: python -m pip install -e .

      - name: Download final research artifact
        uses: actions/download-artifact@v4
        with:
          pattern: moneymaker-20*
          path: victory-trader/source-artifact
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Run edge discovery
        shell: bash
        run: |
          mkdir -p artifacts
          FILE="$(find source-artifact -name research.parquet -print -quit)"
          test -n "$FILE" || { echo "research.parquet not found"; exit 1; }
          python -m victory_trader.edge_discovery "$FILE" \
            --horizon 5 \
            --scenario base \
            --output artifacts/edge-discovery.txt \
            | tee artifacts/edge-discovery.log

      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-edge-discovery-${{ github.event.workflow_run.id }}
          path: |
            victory-trader/artifacts/edge-discovery.txt
            victory-trader/artifacts/edge-discovery.log
          retention-days: 90
