name: MoneyMaker Extended Economic Opportunity

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/extended-history-economic-opportunity-request.json'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Test request 163
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q \
            tests/test_extended_history_economic_opportunity.py \
            tests/test_fresh_validated_attention_economic_opportunity.py \
            tests/test_hot_economic_opportunity.py \
            tests/test_hot_entry_economics.py

  prepare-stage2:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      MASSIVE_S3_ACCESS_KEY: ${{ secrets.MASSIVE_S3_ACCESS_KEY }}
      MASSIVE_S3_SECRET_KEY: ${{ secrets.MASSIVE_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Restore Flat File cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-request163-stage2-flatfiles-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-fresh-economic-flatfiles-${{ runner.os }}-
            moneymaker-fresh-hierarchical-flatfiles-${{ runner.os }}-
      - name: Restore second cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-request163-stage2-second-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-fresh-economic-stage2-second-${{ runner.os }}-
            moneymaker-fresh-economic-second-${{ runner.os }}-
      - name: Prepare stage2
        run: |
          mkdir -p prepared
          python -m victory_trader.extended_history_economic_opportunity \
            prepare stage2 2026-01-02 2026-06-12 \
            --candidates-output prepared/stage2-candidates.parquet \
            --audit-output prepared/stage2-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: request163-stage2-prepared
          path: |
            victory-trader/prepared/stage2-candidates.parquet
            victory-trader/prepared/stage2-audit.json
          if-no-files-found: error
          retention-days: 7

  prepare-opportunity:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      MASSIVE_S3_ACCESS_KEY: ${{ secrets.MASSIVE_S3_ACCESS_KEY }}
      MASSIVE_S3_SECRET_KEY: ${{ secrets.MASSIVE_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Restore Flat File cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-request163-opportunity-flatfiles-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-fresh-economic-flatfiles-${{ runner.os }}-
            moneymaker-fresh-hierarchical-flatfiles-${{ runner.os }}-
      - name: Restore second cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-request163-opportunity-second-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-fresh-economic-opportunity-second-${{ runner.os }}-
            moneymaker-fresh-economic-second-${{ runner.os }}-
      - name: Prepare opportunity
        run: |
          mkdir -p prepared
          python -m victory_trader.extended_history_economic_opportunity \
            prepare opportunity 2026-01-02 2026-06-12 \
            --candidates-output prepared/opportunity-candidates.parquet \
            --audit-output prepared/opportunity-audit.json \
            --scan-output prepared/opportunity-scan.parquet
      - uses: actions/upload-artifact@v4
        with:
          name: request163-opportunity-prepared
          path: |
            victory-trader/prepared/opportunity-candidates.parquet
            victory-trader/prepared/opportunity-audit.json
            victory-trader/prepared/opportunity-scan.parquet
          if-no-files-found: error
          retention-days: 7

  evaluate:
    needs:
      - prepare-stage2
      - prepare-opportunity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: request163-stage2-prepared
          path: victory-trader/prepared/stage2
      - uses: actions/download-artifact@v4
        with:
          name: request163-opportunity-prepared
          path: victory-trader/prepared/opportunity
      - name: Evaluate request 163
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.extended_history_economic_opportunity \
            evaluate \
            --stage2-candidates prepared/stage2/stage2-candidates.parquet \
            --opportunity-candidates prepared/opportunity/opportunity-candidates.parquet \
            --opportunity-scan prepared/opportunity/opportunity-scan.parquet \
            --stage2-audit prepared/stage2/stage2-audit.json \
            --opportunity-audit prepared/opportunity/opportunity-audit.json \
            --output artifacts/extended-history-economic-opportunity-v10.parquet \
            --summary artifacts/extended-history-economic-opportunity-v10.json \
            | tee artifacts/extended-history-economic-opportunity-v10.log
      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-extended-history-economic-opportunity-v10-163
          path: |
            victory-trader/artifacts/extended-history-economic-opportunity-v10.parquet
            victory-trader/artifacts/extended-history-economic-opportunity-v10.json
            victory-trader/artifacts/extended-history-economic-opportunity-v10.log
          if-no-files-found: error
          retention-days: 90
