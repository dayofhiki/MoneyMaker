name: MoneyMaker Trade Tape Feasibility

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/trade-tape-feasibility-request.json'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Test request 170
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_trade_tape_feasibility.py
      - name: Download Request 166 evaluation positions
        uses: actions/download-artifact@v4
        with:
          name: request166-position-evaluation
          path: victory-trader/prepared/position
          repository: dayofhiki/MoneyMaker
          run-id: 36027818439
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Probe historical trades
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.trade_tape_feasibility \
            --evaluation prepared/position/evaluation-paths.parquet \
            --output artifacts/trade-tape-feasibility-v10.json \
            --details artifacts/trade-tape-feasibility-details.csv \
            | tee artifacts/trade-tape-feasibility-v10.log
      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-trade-tape-feasibility-v10-170
          path: |
            victory-trader/artifacts/trade-tape-feasibility-v10.json
            victory-trader/artifacts/trade-tape-feasibility-details.csv
            victory-trader/artifacts/trade-tape-feasibility-v10.log
          if-no-files-found: error
          retention-days: 90
