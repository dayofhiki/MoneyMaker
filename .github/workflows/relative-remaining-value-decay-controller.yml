name: MoneyMaker Relative Remaining Value Decay Controller

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/relative-remaining-value-decay-controller-request.json'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Test request 188
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_relative_remaining_value_decay_controller.py

      - name: Download Request 178 scored POSITION rows
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-fresh-consensus-hurdle-value-v10-178
          path: victory-trader/prepared/request178
          repository: dayofhiki/MoneyMaker
          run-id: 36038233507
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate request 188
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.relative_remaining_value_decay_controller             --scored prepared/request178/fresh-consensus-hurdle-value-v10.parquet             --output artifacts/relative-remaining-value-decay-controller-v10.json             --trajectories-output artifacts/relative-remaining-value-decay-controller-v10.parquet             | tee artifacts/relative-remaining-value-decay-controller-v10.log

      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-relative-remaining-value-decay-controller-v10-188
          path: |
            victory-trader/artifacts/relative-remaining-value-decay-controller-v10.json
            victory-trader/artifacts/relative-remaining-value-decay-controller-v10.parquet
            victory-trader/artifacts/relative-remaining-value-decay-controller-v10.log
          if-no-files-found: error
          retention-days: 90
