name: MoneyMaker Pullback Geometry Gate

on:
  push:
    branches:
      - research/pullback-geometry-gate-224
    paths:
      - 'victory-trader/research/pullback-geometry-gate-request.json'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: victory-trader
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical stack
        run: python -m pip install -e '.[dev]' -c research/request214-requirements.txt
      - name: Check code and geometry-gate contract
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_pullback_geometry_gate.py tests/test_adaptive_pullback_redecision.py tests/test_transition_conditioned_option_value.py
      - name: Download Request 171 rich-second fit/calibration
        uses: actions/download-artifact@v4
        with:
          pattern: request171-rich-second-*
          path: victory-trader/prepared/rich
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36033120106
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Request 163 opportunity scan
        uses: actions/download-artifact@v4
        with:
          name: request163-opportunity-prepared
          path: victory-trader/prepared/opportunity
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Request 223 scored pullback states
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-adaptive-pullback-redecision-223
          path: victory-trader/prepared/request223
          repository: dayofhiki/MoneyMaker
          run-id: 36238987365
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate request 224
        run: |
          set -o pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          python -m victory_trader.pullback_geometry_gate \
            --fit-positions prepared/rich/fit-rich-second.parquet \
            --calibration-positions prepared/rich/calibration-rich-second.parquet \
            --history-scan prepared/opportunity/opportunity-scan.parquet \
            --fresh-states prepared/request223/request223-pullback-states.parquet \
            --output artifacts/request224.json \
            --rows-output artifacts/request224-gated-pullbacks.parquet \
            | tee artifacts/request224.log
      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-pullback-geometry-gate-224
          path: |
            victory-trader/artifacts/request224.json
            victory-trader/artifacts/request224-gated-pullbacks.parquet
            victory-trader/artifacts/request224.log
            victory-trader/artifacts/source-sha.txt
          if-no-files-found: error
          retention-days: 90
