name: MoneyMaker Causal Entry Fast Eval

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/causal-entry-fast-eval-request.json'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Lint fast evaluator
        run: ruff check src/victory_trader/causal_entry_executability_fast_eval.py --select E4,E7,E9,F
      - name: Download fresh shards
        uses: actions/download-artifact@v4
        with:
          pattern: request165-fresh-*
          path: victory-trader/prepared/fresh
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36024489187
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download request 163 stage2
        uses: actions/download-artifact@v4
        with:
          name: request163-stage2-prepared
          path: victory-trader/prepared/stage2
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download request 163 result
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-extended-history-economic-opportunity-v10-163
          path: victory-trader/prepared/history
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate request 165 fast
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.causal_entry_executability_fast_eval \
            --fresh-dir prepared/fresh \
            --history-first-hot prepared/history/extended-history-economic-opportunity-v10.parquet \
            --stage2-candidates prepared/stage2/stage2-candidates.parquet \
            --output artifacts/causal-entry-executability-v10.json \
            | tee artifacts/causal-entry-executability-v10.log
      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-causal-entry-executability-fast-v10-165
          path: |
            victory-trader/artifacts/causal-entry-executability-v10.json
            victory-trader/artifacts/causal-entry-executability-v10.log
          if-no-files-found: error
          retention-days: 90
