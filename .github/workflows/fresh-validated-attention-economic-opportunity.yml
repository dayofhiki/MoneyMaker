name: MoneyMaker Fresh Economic Opportunity

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/fresh-validated-attention-economic-opportunity-request.json'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Test request 162
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q \
            tests/test_fresh_validated_attention_economic_opportunity.py \
            tests/test_fresh_validated_attention_economic_opportunity_sharded.py \
            tests/test_hot_economic_opportunity.py \
            tests/test_hot_entry_economics.py \
            tests/test_fresh_hierarchical_active_validation.py

  prepare-stage2:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      MASSIVE_S3_ACCESS_KEY: ${{ secrets.MASSIVE_S3_ACCESS_KEY }}
      MASSIVE_S3_SECRET_KEY: ${{ secrets.MASSIVE_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Restore market-wide Flat File cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-fresh-economic-stage2-flatfiles-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-fresh-economic-flatfiles-${{ runner.os }}-
            moneymaker-fresh-hierarchical-flatfiles-${{ runner.os }}-
      - name: Restore one-second REST cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-fresh-economic-stage2-second-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-fresh-economic-second-${{ runner.os }}-
            moneymaker-actionable-opportunity-second-${{ runner.os }}-
      - name: Prepare stage-2 fit population
        run: |
          mkdir -p prepared
          python -m victory_trader.fresh_validated_attention_economic_opportunity_sharded \
            prepare stage2 2026-01-02 2026-06-12 \
            --candidates-output prepared/stage2-candidates.parquet \
            --audit-output prepared/stage2-audit.json
      - name: Upload stage-2 prepared artifact
        uses: actions/upload-artifact@v4
        with:
          name: request162-stage2-prepared
          path: |
            victory-trader/prepared/stage2-candidates.parquet
            victory-trader/prepared/stage2-audit.json
          if-no-files-found: error
          retention-days: 7
      - name: Save one-second REST cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-fresh-economic-stage2-second-${{ runner.os }}-${{ github.run_id }}

  prepare-opportunity:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      MASSIVE_S3_ACCESS_KEY: ${{ secrets.MASSIVE_S3_ACCESS_KEY }}
      MASSIVE_S3_SECRET_KEY: ${{ secrets.MASSIVE_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Restore market-wide Flat File cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-fresh-economic-opportunity-flatfiles-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-fresh-economic-flatfiles-${{ runner.os }}-
            moneymaker-fresh-hierarchical-flatfiles-${{ runner.os }}-
      - name: Restore one-second REST cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-fresh-economic-opportunity-second-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-fresh-economic-second-${{ runner.os }}-
            moneymaker-actionable-opportunity-second-${{ runner.os }}-
      - name: Prepare economic-opportunity population
        run: |
          mkdir -p prepared
          python -m victory_trader.fresh_validated_attention_economic_opportunity_sharded \
            prepare opportunity 2026-01-02 2026-06-12 \
            --candidates-output prepared/opportunity-candidates.parquet \
            --audit-output prepared/opportunity-audit.json \
            --scan-output prepared/opportunity-scan.parquet
      - name: Upload opportunity prepared artifact
        uses: actions/upload-artifact@v4
        with:
          name: request162-opportunity-prepared
          path: |
            victory-trader/prepared/opportunity-candidates.parquet
            victory-trader/prepared/opportunity-audit.json
            victory-trader/prepared/opportunity-scan.parquet
          if-no-files-found: error
          retention-days: 7
      - name: Save one-second REST cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-fresh-economic-opportunity-second-${{ runner.os }}-${{ github.run_id }}

  evaluate:
    needs:
      - prepare-stage2
      - prepare-opportunity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Download stage-2 prepared artifact
        uses: actions/download-artifact@v4
        with:
          name: request162-stage2-prepared
          path: victory-trader/prepared/stage2
      - name: Download opportunity prepared artifact
        uses: actions/download-artifact@v4
        with:
          name: request162-opportunity-prepared
          path: victory-trader/prepared/opportunity
      - name: Evaluate request 162
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.fresh_validated_attention_economic_opportunity_sharded \
            evaluate \
            --stage2-candidates prepared/stage2/stage2-candidates.parquet \
            --opportunity-candidates prepared/opportunity/opportunity-candidates.parquet \
            --opportunity-scan prepared/opportunity/opportunity-scan.parquet \
            --stage2-audit prepared/stage2/stage2-audit.json \
            --opportunity-audit prepared/opportunity/opportunity-audit.json \
            --output artifacts/fresh-validated-attention-economic-opportunity-v10.parquet \
            --summary artifacts/fresh-validated-attention-economic-opportunity-v10.json \
            | tee artifacts/fresh-validated-attention-economic-opportunity-v10.log
      - name: Upload request 162 artifact
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-fresh-validated-attention-economic-opportunity-v10-162
          path: |
            victory-trader/artifacts/fresh-validated-attention-economic-opportunity-v10.parquet
            victory-trader/artifacts/fresh-validated-attention-economic-opportunity-v10.json
            victory-trader/artifacts/fresh-validated-attention-economic-opportunity-v10.log
          if-no-files-found: error
          retention-days: 90
