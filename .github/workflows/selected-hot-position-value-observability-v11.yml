name: MoneyMaker Post-143 Position Value Observability

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/selected-hot-position-value-observability-v11-request.json'

permissions:
  contents: read
  actions: read

jobs:
  request:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.read.outputs.enabled }}
      request_id: ${{ steps.read.outputs.request_id }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path("victory-trader/research/selected-hot-position-value-observability-v11-request.json").read_text(
                  encoding="utf-8"
              )
          )
          enabled = payload.get("operation") == "selected_hot_position_value_observability_v11"
          request_id = str(payload.get("request_id", ""))
          if enabled and not request_id:
              raise SystemExit("request 144 is incomplete")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"enabled={'true' if enabled else 'false'}\n")
              handle.write(f"request_id={request_id}\n")
          PY

  diagnose:
    if: ${{ needs.request.outputs.enabled == 'true' }}
    needs: request
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      MASSIVE_S3_ACCESS_KEY: ${{ secrets.MASSIVE_S3_ACCESS_KEY }}
      MASSIVE_S3_SECRET_KEY: ${{ secrets.MASSIVE_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'

      - name: Test post-143 position observability
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q \
            tests/test_selected_hot_position_value_observability.py \
            tests/test_hot_economic_opportunity.py \
            tests/test_hot_entry_economics.py

      - name: Download request 140B artifact
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-hot-economic-opportunity-v11-140
          path: victory-trader/artifacts/request140b
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: dayofhiki/MoneyMaker
          run-id: 35829190438

      - name: Restore market-wide Flat File cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-position-observability-v11-flatfiles-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-hot-opportunity-flatfiles-${{ runner.os }}-
            moneymaker-explicit-integrated-flatfiles-${{ runner.os }}-

      - name: Restore one-second REST cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-position-observability-v11-second-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-hot-opportunity-second-${{ runner.os }}-
            moneymaker-explicit-integrated-second-${{ runner.os }}-

      - name: Run post-143 position-value observability
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.selected_hot_position_value_observability \
            --opportunity artifacts/request140b/hot-economic-opportunity-v11.parquet \
            --opportunity-summary artifacts/request140b/hot-economic-opportunity-v11.json \
            --allow-coverage-only-failure \
            --request-id ${{ needs.request.outputs.request_id }} \
            --output artifacts/selected-hot-position-value-observability-v11.parquet \
            --summary artifacts/selected-hot-position-value-observability-v11.json \
            | tee artifacts/selected-hot-position-value-observability-v11.log
          test -s artifacts/selected-hot-position-value-observability-v11.parquet
          test -s artifacts/selected-hot-position-value-observability-v11.json

      - name: Save one-second REST cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-position-observability-v11-second-${{ runner.os }}-${{ github.run_id }}

      - name: Save market-wide Flat File cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-position-observability-v11-flatfiles-${{ runner.os }}-${{ github.run_id }}

      - name: Upload post-143 position-value observability audit
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-selected-hot-position-value-observability-v11-${{ needs.request.outputs.request_id }}
          path: |
            victory-trader/artifacts/selected-hot-position-value-observability-v11.parquet
            victory-trader/artifacts/selected-hot-position-value-observability-v11.json
            victory-trader/artifacts/selected-hot-position-value-observability-v11.log
          if-no-files-found: error
          retention-days: 90
