name: MoneyMaker Corrected HOT Opportunity

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/actionable-hot-economic-opportunity-request.json'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      MASSIVE_S3_ACCESS_KEY: ${{ secrets.MASSIVE_S3_ACCESS_KEY }}
      MASSIVE_S3_SECRET_KEY: ${{ secrets.MASSIVE_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'

      - name: Test corrected opportunity path
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q \
            tests/test_actionable_active_handoff.py \
            tests/test_hot_economic_opportunity.py \
            tests/test_hot_entry_economics.py \
            tests/test_active_transport_integrated_hierarchy.py

      - name: Restore market-wide Flat File cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-actionable-opportunity-flatfiles-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-actionable-active-flatfiles-${{ runner.os }}-
            moneymaker-causal-population-flatfiles-${{ runner.os }}-
            moneymaker-hot-opportunity-flatfiles-${{ runner.os }}-

      - name: Restore one-second REST cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-actionable-opportunity-second-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-actionable-active-second-${{ runner.os }}-
            moneymaker-causal-population-second-${{ runner.os }}-
            moneymaker-hot-opportunity-second-${{ runner.os }}-

      - name: Run request 148 corrected HOT opportunity
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.actionable_hot_economic_opportunity \
            2026-01-02 2026-05-20 \
            --output artifacts/actionable-hot-economic-opportunity-v10.parquet \
            --summary artifacts/actionable-hot-economic-opportunity-v10.json \
            | tee artifacts/actionable-hot-economic-opportunity-v10.log

      - name: Upload request 148 artifact
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-actionable-hot-economic-opportunity-v10-148
          path: |
            victory-trader/artifacts/actionable-hot-economic-opportunity-v10.parquet
            victory-trader/artifacts/actionable-hot-economic-opportunity-v10.json
            victory-trader/artifacts/actionable-hot-economic-opportunity-v10.log
          if-no-files-found: error
          retention-days: 90

      - name: Save one-second REST cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-actionable-opportunity-second-${{ runner.os }}-${{ github.run_id }}

      - name: Save market-wide Flat File cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-actionable-opportunity-flatfiles-${{ runner.os }}-${{ github.run_id }}
