name: MoneyMaker Oracle Capture Percentile Stopping

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/oracle-capture-percentile-stopping-request.json'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Test request 189
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_oracle_capture_percentile_stopping.py

      - name: Download Request 171 fit/calibration POSITION phases
        uses: actions/download-artifact@v4
        with:
          pattern: request171-rich-second-*
          path: victory-trader/prepared/rich
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36033120106
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Request 178 fresh POSITION shards
        uses: actions/download-artifact@v4
        with:
          pattern: request178-fresh-*
          path: victory-trader/prepared/fresh
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36038233507
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate request 189
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.oracle_capture_percentile_stopping             --fit prepared/rich/fit-rich-second.parquet             --calibration prepared/rich/calibration-rich-second.parquet             --fresh-dir prepared/fresh             --output artifacts/oracle-capture-percentile-stopping-v10.json             --trajectories-output artifacts/oracle-capture-percentile-stopping-v10.parquet             | tee artifacts/oracle-capture-percentile-stopping-v10.log

      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-oracle-capture-percentile-stopping-v10-189
          path: |
            victory-trader/artifacts/oracle-capture-percentile-stopping-v10.json
            victory-trader/artifacts/oracle-capture-percentile-stopping-v10.parquet
            victory-trader/artifacts/oracle-capture-percentile-stopping-v10.log
          if-no-files-found: error
          retention-days: 90
