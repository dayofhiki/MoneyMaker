name: MoneyMaker Edge Discovery v0.4

on:
  push:
    branches:
      - edge-discovery-v0.4
    paths:
      - 'victory-trader/src/victory_trader/edge_discovery.py'
      - 'victory-trader/tests/test_edge_discovery.py'
      - '.github/workflows/edge-discovery-v04.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  march-discovery:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'

      - name: Ruff critical checks
        run: ruff check src tests --select E4,E7,E9,F

      - name: Test
        run: pytest -q

      - name: Download untouched March research artifact
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-2026-03-01-2026-03-31
          path: victory-trader/source-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35221986774

      - name: Run edge discovery
        run: |
          mkdir -p artifacts
          python -m victory_trader.edge_discovery \
            source-artifact/data/events/research.parquet \
            --horizon 5 \
            --scenario base \
            --output artifacts/edge-discovery-march.txt \
            | tee artifacts/edge-discovery-march.log

      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: moneymaker-edge-discovery-2026-03-v04
          path: |
            victory-trader/artifacts/edge-discovery-march.txt
            victory-trader/artifacts/edge-discovery-march.log
          retention-days: 90
