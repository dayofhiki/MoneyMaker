name: MoneyMaker HOT Second Tradability Admission

on:
  push:
    branches:
      - research/hot-second-tradability-230
    paths:
      - 'victory-trader/research/hot-second-tradability-request.json'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical stack
        run: python -m pip install -e '.[dev]' -c research/request214-requirements.txt
      - name: Check code and HOT-second contract
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_hot_second_tradability_admission.py tests/test_hot_tradability_admission.py tests/test_multi_event_entry_continuation.py
      - name: Restore second-bar cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-request230-second-${{ github.run_id }}
          restore-keys: |
            moneymaker-request230-second-
            moneymaker-request220-second-
            moneymaker-request171-second-
            moneymaker-request166-second-
      - name: Download Request 171 rich-second fit/calibration
        uses: actions/download-artifact@v4
        with:
          pattern: request171-rich-second-*
          path: victory-trader/prepared/rich
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36033120106
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Request 163 opportunity scan
        uses: actions/download-artifact@v4
        with:
          name: request163-opportunity-prepared
          path: victory-trader/prepared/opportunity
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Request 178 development shards
        uses: actions/download-artifact@v4
        with:
          pattern: request178-fresh-*
          path: victory-trader/prepared/fresh
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36038233507
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate request 230
        run: |
          set -o pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          python -m victory_trader.hot_second_tradability_admission \
            --fit-positions prepared/rich/fit-rich-second.parquet \
            --calibration-positions prepared/rich/calibration-rich-second.parquet \
            --history-scan prepared/opportunity/opportunity-scan.parquet \
            --fresh-dir prepared/fresh \
            --output artifacts/request230.json \
            --rows-output artifacts/request230-hot-second-states.parquet \
            | tee artifacts/request230.log
      - name: Save second-bar cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-request230-second-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-hot-second-tradability-230
          path: |
            victory-trader/artifacts/request230.json
            victory-trader/artifacts/request230-hot-second-states.parquet
            victory-trader/artifacts/request230.log
            victory-trader/artifacts/source-sha.txt
          if-no-files-found: error
          retention-days: 90
