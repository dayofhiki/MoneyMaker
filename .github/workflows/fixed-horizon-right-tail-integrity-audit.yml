name: MoneyMaker Fixed Horizon Right Tail Integrity Audit

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/fixed-horizon-right-tail-integrity-audit-request.json'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Test request 196A
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_fixed_horizon_right_tail_integrity_audit.py

      - name: Download Request 171 fit POSITION phase
        uses: actions/download-artifact@v4
        with:
          pattern: request171-rich-second-*
          path: victory-trader/prepared/rich
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36033120106
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Request 178 fresh POSITION and scan shards
        uses: actions/download-artifact@v4
        with:
          pattern: request178-fresh-*
          path: victory-trader/prepared/fresh
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36038233507
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Request 163 historical opportunity scan
        uses: actions/download-artifact@v4
        with:
          name: request163-opportunity-prepared
          path: victory-trader/prepared/opportunity
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate request 196A
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.fixed_horizon_right_tail_integrity_audit             --fit prepared/rich/fit-rich-second.parquet             --history-scan prepared/opportunity/opportunity-scan.parquet             --fresh-dir prepared/fresh             --output artifacts/fixed-horizon-right-tail-integrity-audit-v10.json             | tee artifacts/fixed-horizon-right-tail-integrity-audit-v10.log

      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-fixed-horizon-right-tail-integrity-audit-v10-196A
          path: |
            victory-trader/artifacts/fixed-horizon-right-tail-integrity-audit-v10.json
            victory-trader/artifacts/fixed-horizon-right-tail-integrity-audit-v10.log
          if-no-files-found: error
          retention-days: 90
