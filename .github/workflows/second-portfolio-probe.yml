name: MoneyMaker Second Portfolio Development Probe

on:
  push:
    branches:
      - research/causal-second-execution-20260925
    paths:
      - 'victory-trader/research/second-portfolio-probe-request.json'
      - '.github/workflows/second-portfolio-probe.yml'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Verify causal probe code
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_causal_second_execution.py tests/test_second_path_adapter.py tests/test_second_portfolio_replay.py tests/test_second_portfolio_probe.py
      - name: Download already-open June 23 prepared positions
        uses: actions/download-artifact@v4
        with:
          name: request178-fresh-2026-06-23
          path: victory-trader/prepared/fresh
          repository: dayofhiki/MoneyMaker
          run-id: 36038233507
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Diagnose June 23 only
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          mkdir -p artifacts
          python -m victory_trader.second_portfolio_probe \
            --fresh-dir prepared/fresh \
            --output artifacts/second-portfolio-development-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneymaker-second-portfolio-development-probe
          path: victory-trader/artifacts/second-portfolio-development-probe.json
          if-no-files-found: warn
          retention-days: 30
