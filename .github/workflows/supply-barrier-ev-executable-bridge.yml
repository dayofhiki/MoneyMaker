name: MoneyMaker Supply Barrier EV Executable Bridge

on:
  push:
    branches:
      - research/causal-second-execution-20260925
    paths:
      - 'victory-trader/research/supply-barrier-ev-executable-bridge-request.json'

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Test request 202
        run: |
          ruff check \
            src/victory_trader/supply_barrier_ev_executable_bridge.py \
            tests/test_supply_barrier_ev_executable_bridge.py \
            --select E4,E7,E9,F
          pytest -q tests/test_supply_barrier_ev_executable_bridge.py
      - name: Restore causal second cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: request202-second-${{ github.run_id }}
          restore-keys: |
            request197-second-
            moneymaker-request171-second-fit-
            moneymaker-request171-second-calibration-
      - name: Restore supply cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-rest-request201-supply
          key: request202-supply-${{ github.run_id }}
          restore-keys: |
            request201-supply-
      - name: Download Request 171 FIT/CAL POSITION states
        uses: actions/download-artifact@v4
        with:
          pattern: request171-rich-second-*
          path: victory-trader/prepared/rich
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36033120106
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download historical market scan
        uses: actions/download-artifact@v4
        with:
          name: request163-opportunity-prepared
          path: victory-trader/prepared/opportunity
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate request 202
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.supply_barrier_ev_executable_bridge \
            --fit prepared/rich/fit-rich-second.parquet \
            --calibration prepared/rich/calibration-rich-second.parquet \
            --history-scan prepared/opportunity/opportunity-scan.parquet \
            --output artifacts/supply-barrier-ev-executable-bridge-v10.json \
            | tee artifacts/supply-barrier-ev-executable-bridge-v10.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneymaker-supply-barrier-ev-executable-bridge-v10-202
          path: |
            victory-trader/artifacts/supply-barrier-ev-executable-bridge-v10.json
            victory-trader/artifacts/supply-barrier-ev-executable-bridge-v10.log
          if-no-files-found: warn
          retention-days: 90
