name: MoneyMaker Fresh Consensus Hurdle Value

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/fresh-consensus-hurdle-value-request.json'

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Test request 178
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_fresh_consensus_hurdle_value.py

  prepare:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        day:
          - '2026-06-23'
          - '2026-06-24'
          - '2026-06-25'
          - '2026-06-26'
          - '2026-06-29'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: victory-trader
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      MASSIVE_S3_ACCESS_KEY: ${{ secrets.MASSIVE_S3_ACCESS_KEY }}
      MASSIVE_S3_SECRET_KEY: ${{ secrets.MASSIVE_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Restore Flat File cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-request178-flatfiles-${{ matrix.day }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-request165-shard-flatfiles-
            moneymaker-request165-flatfiles-
            moneymaker-request163-opportunity-flatfiles-
      - name: Restore REST cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive
          key: moneymaker-request178-rest-${{ matrix.day }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-request165-shard-rest-
            moneymaker-request165-rest-
            moneymaker-fresh-economic-rest-
      - name: Restore second cache
        uses: actions/cache/restore@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-request178-second-${{ matrix.day }}-${{ github.run_id }}
          restore-keys: |
            moneymaker-request171-second-
            moneymaker-request166-second-
            moneymaker-request165-shard-second-
      - name: Download Request 163 stage2
        uses: actions/download-artifact@v4
        with:
          name: request163-stage2-prepared
          path: victory-trader/prepared/stage2
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Request 163 historical first-HOT
        uses: actions/download-artifact@v4
        with:
          name: moneymaker-extended-history-economic-opportunity-v10-163
          path: victory-trader/prepared/history
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare one fresh day
        run: |
          mkdir -p prepared/fresh
          python -m victory_trader.fresh_consensus_hurdle_value \
            prepare-day ${{ matrix.day }} \
            --history-first-hot prepared/history/extended-history-economic-opportunity-v10.parquet \
            --stage2-candidates prepared/stage2/stage2-candidates.parquet \
            --positions-output prepared/fresh/${{ matrix.day }}-positions.parquet \
            --scan-output prepared/fresh/${{ matrix.day }}-scan.parquet \
            --audit-output prepared/fresh/${{ matrix.day }}-audit.json
      - name: Save Flat File cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive-flatfiles
          key: moneymaker-request178-flatfiles-${{ matrix.day }}-${{ github.run_id }}
      - name: Save REST cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive
          key: moneymaker-request178-rest-${{ matrix.day }}-${{ github.run_id }}
      - name: Save second cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: victory-trader/data/cache/massive-second-attention
          key: moneymaker-request178-second-${{ matrix.day }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: request178-fresh-${{ matrix.day }}
          path: victory-trader/prepared/fresh/
          if-no-files-found: error
          retention-days: 14

  evaluate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Download fresh shards
        uses: actions/download-artifact@v4
        with:
          pattern: request178-fresh-*
          path: victory-trader/prepared/fresh
          merge-multiple: true
      - name: Download Request 171 rich-second phases
        uses: actions/download-artifact@v4
        with:
          pattern: request171-rich-second-*
          path: victory-trader/prepared/rich
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36033120106
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Request 163 opportunity scan
        uses: actions/download-artifact@v4
        with:
          name: request163-opportunity-prepared
          path: victory-trader/prepared/opportunity
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate request 178
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.fresh_consensus_hurdle_value \
            evaluate \
            --fit prepared/rich/fit-rich-second.parquet \
            --calibration prepared/rich/calibration-rich-second.parquet \
            --history-scan prepared/opportunity/opportunity-scan.parquet \
            --fresh-dir prepared/fresh \
            --output artifacts/fresh-consensus-hurdle-value-v10.json \
            --scored-output artifacts/fresh-consensus-hurdle-value-v10.parquet \
            | tee artifacts/fresh-consensus-hurdle-value-v10.log
      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-fresh-consensus-hurdle-value-v10-178
          path: |
            victory-trader/artifacts/fresh-consensus-hurdle-value-v10.json
            victory-trader/artifacts/fresh-consensus-hurdle-value-v10.parquet
            victory-trader/artifacts/fresh-consensus-hurdle-value-v10.log
          if-no-files-found: error
          retention-days: 90
