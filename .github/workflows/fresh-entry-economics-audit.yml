name: MoneyMaker Fresh Entry Economics Audit

on:
  push:
    branches:
      - main
    paths:
      - 'victory-trader/research/fresh-entry-economics-audit-request.json'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: victory-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MoneyMaker
        run: python -m pip install -e '.[dev]'
      - name: Test request 181
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_fresh_entry_economics_audit.py
      - name: Download Request 178 fresh shards
        uses: actions/download-artifact@v4
        with:
          pattern: request178-fresh-*
          path: victory-trader/prepared/fresh
          merge-multiple: true
          repository: dayofhiki/MoneyMaker
          run-id: 36038233507
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit request 181
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m victory_trader.fresh_entry_economics_audit \
            --fresh-dir prepared/fresh \
            --output artifacts/fresh-entry-economics-audit-v10.json \
            --rows-output artifacts/fresh-entry-economics-audit-v10.parquet \
            | tee artifacts/fresh-entry-economics-audit-v10.log
      - uses: actions/upload-artifact@v4
        with:
          name: moneymaker-fresh-entry-economics-audit-v10-181
          path: |
            victory-trader/artifacts/fresh-entry-economics-audit-v10.json
            victory-trader/artifacts/fresh-entry-economics-audit-v10.parquet
            victory-trader/artifacts/fresh-entry-economics-audit-v10.log
          if-no-files-found: error
          retention-days: 90
