name: MoneyMaker Fixed Policy Tail Economics

on:
  push:
    branches:
      - research/fixed-policy-tail-economics-250
    paths:
      - 'victory-trader/research/fixed-policy-tail-economics-request.json'
      - 'victory-trader/src/victory_trader/fixed_policy_tail_economics.py'
      - 'victory-trader/tests/test_fixed_policy_tail_economics.py'
      - '.github/workflows/fixed-policy-tail-economics.yml'
  pull_request:
    paths:
      - 'victory-trader/research/fixed-policy-tail-economics-request.json'
      - 'victory-trader/src/victory_trader/fixed_policy_tail_economics.py'
      - 'victory-trader/tests/test_fixed_policy_tail_economics.py'
      - '.github/workflows/fixed-policy-tail-economics.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: victory-trader
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical stack
        run: python -m pip install -e '.[dev]' -c research/request214-requirements.txt
      - name: Check Request250 contracts
        run: |
          ruff check src tests --select E4,E7,E9,F
          pytest -q tests/test_fixed_policy_tail_economics.py tests/test_full_hot_fixed_policy_value.py
      - name: Download Request163 stage2 population
        uses: actions/download-artifact@v4
        with:
          name: request163-stage2-prepared
          path: victory-trader/prepared/stage2
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Request163 opportunity population
        uses: actions/download-artifact@v4
        with:
          name: request163-opportunity-prepared
          path: victory-trader/prepared/opportunity
          repository: dayofhiki/MoneyMaker
          run-id: 36001945920
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate Request250
        run: |
          set -o pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          python -m victory_trader.fixed_policy_tail_economics \
            --stage2-candidates prepared/stage2/stage2-candidates.parquet \
            --opportunity-candidates prepared/opportunity/opportunity-candidates.parquet \
            --opportunity-scan prepared/opportunity/opportunity-scan.parquet \
            --output artifacts/request250.json \
            | tee artifacts/request250.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneymaker-fixed-policy-tail-economics-250
          path: |
            victory-trader/artifacts/request250.json
            victory-trader/artifacts/request250.log
            victory-trader/artifacts/source-sha.txt
          if-no-files-found: warn
          retention-days: 90
